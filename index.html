<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalananti – Placement Test Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --k-blue: #265E9B;
      --k-blue-d: #1A4576;
      --k-yellow: #F9C013;
      --k-green: #339D9D;
      --bg: #e8f2ff;
      --bg2: #dbeeff;
      --sky: #cfe5ff;
      --nebula1: rgba(38,94,155,0.10);
      --nebula2: rgba(249,192,19,0.10);
      --card: rgba(255,255,255,0.92);
      --card-b: rgba(180,215,255,0.85);
      --text: #1a4576;
      --muted: #4d7daf;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background:
        radial-gradient(circle at 10% 10%, var(--nebula1), transparent 36%),
        radial-gradient(circle at 88% 12%, var(--nebula2), transparent 32%),
        radial-gradient(circle at 50% 105%, rgba(51,157,157,0.14), transparent 34%),
        linear-gradient(160deg, var(--bg) 0%, var(--bg2) 50%, var(--sky) 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none; z-index: -20;
      opacity: 0.12;
      background-image:
        radial-gradient(circle at 14% 24%, rgba(255,255,255,0.9) 0 1px, transparent 1.6px),
        radial-gradient(circle at 78% 68%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 56% 38%, rgba(255,255,255,0.60) 0 1px, transparent 1.4px),
        radial-gradient(circle at 30% 82%, rgba(255,255,255,0.50) 0 1px, transparent 1.3px),
        radial-gradient(circle at 90% 45%, rgba(255,255,255,0.55) 0 1px, transparent 1.4px);
      background-size: 250px 250px, 320px 320px, 210px 210px, 290px 290px, 180px 180px;
      animation: starDrift 200s linear infinite;
    }
    @keyframes starDrift { to { transform: translate3d(-120px, 70px, 0); } }

    /* Floating edge planets and space character assets */
    .edge-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .edge-planet { position: absolute; pointer-events: none; opacity: 0.55; }
    .edge-left  { left: 0; }
    .edge-right { right: 0; }
    .char-float {
      position: absolute; pointer-events: none; opacity: 0.55;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.15));
    }
    @keyframes floatY  { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-18px) rotate(2deg); } }
    @keyframes floatY2 { 0%,100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-14px) rotate(-2deg); } }
    @keyframes twinkle { 0%,100% { opacity:0.4; transform:scale(0.9); } 50% { opacity:1; transform:scale(1.2); } }
    .animate-twinkle { animation: twinkle 3s ease-in-out infinite; }

    .topbar {
      position: fixed; top: 0; left: 0; z-index: 9990;
      display: flex; width: 100%; min-height: 60px;
      align-items: center; justify-content: center; gap: 14px;
      padding: 12px 22px; border-bottom: 1px solid rgba(165,204,244,.85);
      background: rgba(255,255,255,.95);
      box-shadow: 0 10px 35px -25px rgba(38,94,155,.6);
      backdrop-filter: blur(10px);
    }
    .topbar .brand {
      display: flex; align-items: center; gap: 12px;
      color: var(--k-blue-d); font-family: 'Orbitron', sans-serif;
      font-weight: 900; white-space: nowrap; font-size: 1.2rem;
      letter-spacing: 0.04em; text-align: center;
    }
    .topbar .brand img { height: 32px; width: auto; }
    .topbar .brand span { color: var(--k-blue); font-weight: 800; }

    .card {
      width: min(580px, 94%);
      background: rgba(255,255,255,.94);
      border: 1.5px solid var(--card-b);
      border-radius: 2rem;
      padding: 42px 36px;
      box-shadow: 0 24px 64px -16px rgba(38,94,155,.18), 0 0 0 4px rgba(255,255,255,.6);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 10;
      margin-top: 60px;
    }

    .hero { text-align: center; margin-bottom: 28px; display: flex; flex-direction: column; align-items: center; }

    .main-logo-img {
      height: clamp(52px, 8vw, 68px);
      width: auto;
      display: block;
      margin: 0 auto 12px auto;
      filter: drop-shadow(0 6px 16px rgba(38,94,155,0.18));
    }

    .subtitle-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.2rem, 3.2vw, 1.6rem);
      color: var(--k-blue);
      letter-spacing: 0.12em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px; border-radius: 999px;
      background: rgba(249,192,19,0.15); color: #92600A;
      border: 1.5px solid rgba(249,192,19,0.4);
      font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    p.subtitle {
      color: var(--muted); text-align: center; font-size: 0.98rem; font-weight: 600; line-height: 1.55; max-width: 480px; margin: 0 auto 24px;
    }

    .form-grid { display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 800; font-size: 0.9rem; color: var(--k-blue-d); display: flex; align-items: center; gap: 6px; }
    label i { color: var(--k-blue); }

    input, select {
      width: 100%; padding: 14px 16px; border-radius: 1rem;
      border: 2px solid rgba(38,94,155,0.22); background: rgba(255,255,255,0.85);
      color: var(--text); font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      font-size: 0.98rem; outline: none; transition: all 0.25s ease;
    }
    input:focus, select:focus {
      border-color: var(--k-blue); background: #fff;
      box-shadow: 0 0 0 4px rgba(38,94,155,0.14);
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      opacity: 1; 
    }

    .btn-submit {
      background: linear-gradient(180deg, #F9C013 0%, #E5AB00 100%);
      color: #5A3F00; font-family: 'Orbitron', sans-serif; font-weight: 900;
      font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase;
      border: none; padding: 16px 24px; border-radius: 1.2rem;
      cursor: pointer; transition: all 0.15s ease;
      box-shadow: 0 6px 0 #B28400, 0 16px 28px -8px rgba(249,192,19,0.45);
      margin-top: 10px; width: 100%;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #B28400, 0 20px 36px -8px rgba(249,192,19,0.5); }
    .btn-submit:active { transform: translateY(6px); box-shadow: 0 0 0 #B28400; }

    .error-msg {
      background: #fee2e2; border: 1.5px solid #f87171; color: #b91c1c;
      padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 700;
      display: none; align-items: center; gap: 8px; margin-bottom: 16px;
    }
    .error-msg.visible { display: flex; }
  </style>
</head>
<body>

  <!-- Floating Edge Planets & Characters -->
  <div class="edge-layer">
    <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/e77f536b-e591-4ba8-b5b8-f5b2a3d3b33b.png" class="edge-planet edge-left" style="top:6%; width:min(22vw,170px);" alt="">
    <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/c08a7aed-567f-4e37-988c-1423a5b92643.png" class="edge-planet edge-left" style="top:65%; width:min(28vw,220px); transform:translateX(-30%);" alt="">
    <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/5f93f855-0466-47b3-ba85-bbaabbad7a2e.png" class="edge-planet edge-right" style="top:20%; width:min(26vw,210px); transform:translateX(30%);" alt="">
    <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/434fc5cb-e490-4e40-a921-d4519aa8a8a4.png" class="edge-planet edge-right" style="bottom:5%; width:min(30vw,250px);" alt="">
    <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/61f06160-989d-402e-be1b-eb1891afa86b.png" class="char-float" style="left:8%; top:20%; width:90px; animation:floatY 7s ease-in-out infinite;" alt="">
    <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/904cb9e9-ecd1-4731-a1ef-fa6a0bd50527.png" class="char-float" style="right:11%; top:52%; width:100px; animation:floatY2 8s ease-in-out infinite 1.5s;" alt="">
    <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/9b916b05-86ed-4509-aef6-e640606f3542.png" class="char-float" style="left:14%; bottom:8%; width:95px; animation:floatY 6s ease-in-out infinite 0.8s;" alt="">
  </div>

  <!-- Glow Orbs -->
  <div style="position:fixed; top:-8rem; left:-6rem; width:36rem; height:36rem; pointer-events:none; z-index:-1; background:radial-gradient(circle, rgba(38,94,155,0.10) 0%, transparent 65%);"></div>
  <div style="position:fixed; bottom:-8rem; right:-6rem; width:32rem; height:32rem; pointer-events:none; z-index:-1; background:radial-gradient(circle, rgba(249,192,19,0.12) 0%, transparent 65%);"></div>

  <!-- Twinkle Stars -->
  <div style="position:fixed; top:26%; left:36%; width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.9); pointer-events:none; z-index:-1;" class="animate-twinkle"></div>
  <div style="position:fixed; top:60%; right:30%; width:8px; height:8px; border-radius:50%; background:#fde68a; pointer-events:none; z-index:-1; animation-delay:1.3s;" class="animate-twinkle"></div>
  <div style="position:fixed; top:14%; right:44%; width:6px; height:6px; border-radius:50%; background:#bfdbfe; pointer-events:none; z-index:-1; animation-delay:0.7s;" class="animate-twinkle"></div>

  <header class="topbar">
    <div class="brand">
      <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/545c0426-169c-406f-8775-93afcacef50a.png" alt="Kalananti Logo">
      <span>PLACEMENT TEST</span>
    </div>
  </header>

  <main class="card">
    <div class="hero">
      <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/545c0426-169c-406f-8775-93afcacef50a.png" alt="Kalananti Logo" class="main-logo-img">
      <div class="subtitle-title">PLACEMENT TEST</div>
      <div class="eyebrow"><i class="fa-solid fa-star"></i> Misi Penentuan Modul</div>
      <p class="subtitle">Silakan isi data calon siswa untuk memulai petualangan placement test interaktif!</p>
    </div>

    <div class="error-msg" id="errorMsg">
      <i class="fa-solid fa-triangle-exclamation"></i> <span id="errorText">Mohon lengkapi semua data dengan benar.</span>
    </div>

    <form id="regForm" class="form-grid" onsubmit="handleRegistration(event)">
      <div class="field">
        <label for="nameInput"><i class="fa-solid fa-user"></i> Nama Panggilan Siswa</label>
        <input type="text" id="nameInput" placeholder="Contoh: Nara" required />
      </div>

      <div class="field">
        <label for="ageInput"><i class="fa-solid fa-cake-candles"></i> Usia Siswa (Tahun)</label>
        <input type="number" id="ageInput" min="5" max="18" placeholder="Ketik angka usia (contoh: 8)" required />
      </div>

      <div class="field">
        <label for="emailInput"><i class="fa-solid fa-envelope"></i> Email Orang Tua</label>
        <input type="email" id="emailInput" placeholder="orangtua@example.com" required />
      </div>

      <div class="field">
        <label for="cabangInput"><i class="fa-solid fa-location-dot"></i> Cabang Kalananti</label>
        <select id="cabangInput" required>
          <option value="">-- Pilih cabang --</option>
          <option value="Jakarta Selatan">Jakarta Selatan</option>
          <option value="Tangerang Selatan">Tangerang Selatan</option>
          <option value="Bandung">Bandung</option>
          <option value="Surabaya">Surabaya</option>
          <option value="Online">Online / Remote</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">
        Mulai Placement Test <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </main>

  <script src="placement-session.js"></script>
  <script src="placement-sync.js"></script>
  <script>
    window.PlacementSync?.configure();

    (function resumeExistingPlacementSession() {
      const registration = (() => {
        try {
          return JSON.parse(
            localStorage.getItem('pt_student_registration')
            || localStorage.getItem('pt_student_profile')
            || 'null'
          );
        } catch (error) {
          return null;
        }
      })();
      if (!registration || registration.isCompleted) return;

      const student = registration.student || registration;
      const audience = String(student.audienceGroup || '').toLowerCase();
      const target = audience === 'junior'
        ? 'junior-final-placement-test.html'
        : audience === 'teens'
          ? 'teens.html'
          : audience === 'kids'
            ? 'kids-final-placement-test.html'
            : '';
      if (target) {
        const submissionId = registration.submissionId
          || window.PlacementSession?.getActiveSubmissionId?.()
          || '';
        const suffix = submissionId ? `?sid=${encodeURIComponent(submissionId)}` : '';
        window.location.replace(`${target}${suffix}`);
      }
    })();
    
    function clearAllPlacementSessionData() {
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && (key.startsWith('pt_') || key.startsWith('kalananti-'))) {
          keysToRemove.push(key);
        }
      }
      keysToRemove.forEach(k => localStorage.removeItem(k));
    }

    function handleRegistration(event) {
      event.preventDefault();
      const name = document.getElementById('nameInput').value.trim();
      const ageVal = document.getElementById('ageInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const cabang = document.getElementById('cabangInput').value;
      const errorMsg = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');

      if (!name || !ageVal || !email || !cabang) {
        errorText.textContent = 'Mohon isi semua data registrasi terlebih dahulu.';
        errorMsg.classList.add('visible');
        return;
      }

      const exactAge = parseInt(ageVal);
      if (isNaN(exactAge) || exactAge < 5 || exactAge > 18) {
        errorText.textContent = 'Mohon masukkan angka usia yang valid (5–18 tahun).';
        errorMsg.classList.add('visible');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorText.textContent = 'Format email orang tua tidak valid.';
        errorMsg.classList.add('visible');
        return;
      }

      errorMsg.classList.remove('visible');

      // Sorting to appropriate target assessment file based on exact age
      let audienceGroup = 'Kids';
      let ageRange = '8–11';
      let targetFile = 'kids-final-placement-test.html';

      if (exactAge <= 7) {
        audienceGroup = 'Junior';
        ageRange = '5–7';
        targetFile = 'junior-final-placement-test.html';
      } else if (exactAge <= 11) {
        audienceGroup = 'Kids';
        ageRange = '8–11';
        targetFile = 'kids-final-placement-test.html';
      } else if (exactAge <= 15) {
        audienceGroup = 'Kids';
        ageRange = '12–15';
        targetFile = 'kids-final-placement-test.html';
      } else {
        audienceGroup = 'Teens';
        ageRange = '16–18';
        targetFile = 'teens.html';
      }

      const registrationData = {
        student: {
          name: name,
          exactAge: exactAge, // Exact numeric age stored for backend reporting!
          ageRange: ageRange,
          audienceGroup: audienceGroup,
          parentEmail: email,
          branch: cabang
        },
        registeredAt: new Date().toISOString(),
        timestamp: Date.now(),
        isCompleted: false,
        submissionId: 'pt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6)
      };

      try {
        clearAllPlacementSessionData();
        window.PlacementSession?.create(registrationData);
        localStorage.setItem('pt_student_registration', JSON.stringify(registrationData));
        localStorage.setItem('pt_student_profile', JSON.stringify(registrationData));
        window.PlacementSync?.register(registrationData);
      } catch (e) {
        console.error('Storage error:', e);
      }

      // Route to target assessment file
      window.location.href = `${targetFile}?sid=${encodeURIComponent(registrationData.submissionId)}`;
    }
  </script>
</body>
</html>
