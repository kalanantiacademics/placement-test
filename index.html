<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalananti – Placement Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --k-blue: #265E9B;
            --k-blue-d: #1A4576;
            --k-yellow: #F9C013;
            --k-green: #339D9D;
            --bg:  #e8f2ff;
            --bg2: #dbeeff;
            --sky:  #cfe5ff;
            --nebula1: rgba(38,94,155,0.10);
            --nebula2: rgba(249,192,19,0.10);
            --card: rgba(255,255,255,0.92);
            --card-b: rgba(180,215,255,0.85);
            --text: #1a4576;
            --muted: #4d7daf;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background:
                radial-gradient(circle at 10% 10%, var(--nebula1), transparent 36%),
                radial-gradient(circle at 88% 12%, var(--nebula2), transparent 32%),
                radial-gradient(circle at 50% 105%, rgba(51,157,157,0.14), transparent 34%),
                linear-gradient(160deg, var(--bg) 0%, var(--bg2) 50%, var(--sky) 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed; inset: 0;
            pointer-events: none; z-index: -20;
            opacity: 0.12;
            background-image:
                radial-gradient(circle at 14% 24%, rgba(255,255,255,0.9) 0 1px, transparent 1.6px),
                radial-gradient(circle at 78% 68%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
                radial-gradient(circle at 56% 38%, rgba(255,255,255,0.60) 0 1px, transparent 1.4px),
                radial-gradient(circle at 30% 82%, rgba(255,255,255,0.50) 0 1px, transparent 1.3px),
                radial-gradient(circle at 90% 45%, rgba(255,255,255,0.55) 0 1px, transparent 1.4px);
            background-size: 250px 250px, 320px 320px, 210px 210px, 290px 290px, 180px 180px;
            animation: starDrift 200s linear infinite;
        }
        @keyframes starDrift { to { transform: translate3d(-120px, 70px, 0); } }

        .edge-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .edge-planet { position: absolute; pointer-events: none; opacity: 0.55; }
        .edge-left  { left: 0; }
        .edge-right { right: 0; }
        .char-float {
            position: absolute; pointer-events: none; opacity: 0.5;
            filter: drop-shadow(0 12px 24px rgba(0,0,0,0.15));
        }
        @keyframes floatY  { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-18px) rotate(2deg); } }
        @keyframes floatY2 { 0%,100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-14px) rotate(-2deg); } }
        @keyframes twinkle { 0%,100% { opacity:0.4; transform:scale(0.9); } 50% { opacity:1; transform:scale(1.2); } }
        .animate-twinkle { animation: twinkle 3s ease-in-out infinite; }
        .animate-bobble  { animation: bobble 4s ease-in-out infinite; }
        @keyframes bobble { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

        /* ── Card / Panel ── */
        .glass-panel {
            background: var(--card);
            border: 1.5px solid var(--card-b);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 40px 36px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 24px 64px -16px rgba(38,94,155,0.18), 0 0 0 4px rgba(255,255,255,0.6);
            position: relative;
            z-index: 10;
        }

        .fade-in { animation: fadeIn 0.45s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(12px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }

        /* ── Typography ── */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            color: var(--k-blue-d);
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.02em;
        }
        h1 span { color: var(--k-yellow); }
        p.subtitle { color: var(--muted); margin-bottom: 28px; text-align: center; font-size: 1rem; font-weight: 600; }
        h2 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--k-blue-d); margin-bottom: 12px; font-weight: 800; }

        /* ── Form inputs ── */
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: var(--k-blue-d); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.02em; }
        input, select {
            width: 100%; padding: 14px 18px; border-radius: 1rem;
            border: 2px solid rgba(38,94,155,0.22);
            background: rgba(255,255,255,0.8); color: var(--text);
            font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 600;
            outline: none; transition: all 0.25s;
        }
        input:focus, select:focus {
            border-color: var(--k-blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(38,94,155,0.12);
        }

        /* ── CTA Button (3D yellow) ── */
        button.btn-main {
            background: linear-gradient(180deg, #F9C013 0%, #E5AB00 100%);
            color: #5A3F00;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            padding: 16px 24px;
            border-radius: 1.2rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 7px 0 #B28400, 0 16px 28px -8px rgba(249,192,19,0.45);
            margin-top: 12px;
        }
        button.btn-main:hover  { transform: translateY(-2px); box-shadow: 0 9px 0 #B28400, 0 20px 36px -8px rgba(249,192,19,0.5); }
        button.btn-main:active { transform: translateY(7px);  box-shadow: 0 0px 0 #B28400, 0 6px 12px -4px rgba(249,192,19,0.3); }

        /* ── Option cards (emoji grid) ── */
        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 8px;
        }
        .option-btn {
            background: rgba(255,255,255,0.85);
            border: 2px solid rgba(38,94,155,0.18);
            border-bottom: 5px solid rgba(38,94,155,0.28);
            color: var(--k-blue-d);
            padding: 18px 12px;
            border-radius: 1.2rem;
            cursor: pointer;
            transition: all 0.18s ease;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 130px;
            line-height: 1.35;
            text-align: center;
        }
        .option-btn:hover {
            background: #eff6ff;
            border-color: var(--k-blue);
            border-bottom-color: var(--k-blue-d);
            transform: translateY(-4px);
            box-shadow: 0 10px 24px -8px rgba(38,94,155,0.25);
        }
        .option-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
        .option-btn .emoji-icon { font-size: 2.6rem; }

        /* ── Progress ── */
        .progress-container { margin-bottom: 28px; }
        .progress-bar { height: 10px; background: rgba(38,94,155,0.1); border-radius: 5px; overflow: hidden; border: 1px solid rgba(38,94,155,0.12); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--k-blue), var(--k-green)); width: 0%; transition: width 0.4s ease-out; }
        .progress-text { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.85rem; color: var(--muted); font-weight: 700; }

        /* ── Question text ── */
        .question-text {
            font-size: 1.25rem;
            margin-bottom: 22px;
            line-height: 1.6;
            font-weight: 700;
            color: var(--k-blue-d);
            background: rgba(38,94,155,0.06);
            border: 1.5px solid rgba(38,94,155,0.12);
            border-radius: 1rem;
            padding: 18px 20px;
        }

        /* ── Pro logic question visuals ── */
        .pro-logic-panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(238,247,255,0.92));
            border: 2px solid rgba(38,94,155,0.16);
            border-radius: 18px;
            padding: 18px;
            color: var(--k-blue-d);
        }
        .pro-panel-title {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
            text-align: left;
        }
        .pro-route-map {
            display: grid;
            grid-template-columns: repeat(5, 48px);
            gap: 8px;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .pro-cell {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #ffffff;
            border: 1.5px solid rgba(38,94,155,0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(38,94,155,0.08);
        }
        .pro-cell.start { background: #dbeafe; color: #1d4ed8; }
        .pro-cell.finish { background: #dcfce7; color: #15803d; }
        .pro-cell.blocked { background: #fee2e2; color: #b91c1c; }
        .pro-code-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .pro-code-card {
            background: #0f172a;
            border: 1px solid rgba(148,163,184,0.28);
            border-radius: 12px;
            padding: 12px;
            color: #e2e8f0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.82rem;
            line-height: 1.55;
            text-align: left;
        }
        .pro-code-card b { color: #facc15; }
        .pro-rule {
            background: #ffffff;
            border: 1.5px solid rgba(38,94,155,0.14);
            border-left: 5px solid var(--k-blue);
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            font-weight: 700;
            line-height: 1.5;
        }
        .pro-flow {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }
        .pro-flow-step {
            min-width: 92px;
            background: #ffffff;
            border: 1.5px solid rgba(38,94,155,0.15);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            font-weight: 800;
        }
        .pro-flow-step.warning {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #92400e;
        }

        /* ── Badge ── */
        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 2rem; font-size: 0.8rem;
            background: rgba(249,192,19,0.15); color: #92600A;
            border: 1.5px solid rgba(249,192,19,0.4);
            margin-bottom: 16px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .badge.hard { background: rgba(239,68,68,0.1); color: #b91c1c; border-color: rgba(239,68,68,0.3); }

        /* ── Result screen ── */
        .result-card {
            background: rgba(255,255,255,0.7);
            border: 1.5px solid rgba(38,94,155,0.15);
            border-radius: 1.2rem;
            padding: 22px 24px;
            margin-bottom: 18px;
            text-align: center;
        }
        .highlight {
            font-family: 'Orbitron', sans-serif;
            color: var(--k-blue-d);
            font-weight: 800;
            font-size: 1.5rem;
            margin: 10px 0;
        }
        .roadmap { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        .roadmap-item {
            background: rgba(255,255,255,0.8);
            border: 2px solid rgba(38,94,155,0.18);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--k-blue-d);
        }
        .roadmap-item.active {
            background: linear-gradient(135deg, var(--k-blue), var(--k-blue-d));
            color: #fff;
            border-color: var(--k-blue-d);
            box-shadow: 0 6px 0 #0d2542, 0 12px 20px -8px rgba(38,94,155,0.5);
        }
        .roadmap-arrow { color: var(--muted); font-size: 1rem; }

        /* ── Unified Mode UI (Dulu Kids Mode) ── */
        .option-btn {
            min-height: 150px;
            font-size: 1.1rem;
            border-radius: 1.5rem;
        }
        .option-btn .emoji-icon {
            font-size: 3.2rem;
        }

        /* ── Loader ── */
        #pt-loader {
            position: fixed; inset: 0; background: #dbeeff;
            z-index: 10000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.7s ease, visibility 0.7s;
        }
        #pt-loader.loaded { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-rocket { width: 110px; animation: loaderFloat 2.5s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(249,192,19,0.4)); }
        @keyframes loaderFloat { 0%,100% { transform:translateY(0) rotate(-6deg); } 50% { transform:translateY(-28px) rotate(6deg); } }
        .loader-bar { width: 240px; height: 8px; background: rgba(38,94,155,0.1); border-radius: 4px; margin-top: 36px; overflow: hidden; border: 1px solid rgba(38,94,155,0.15); }
        .loader-progress { height: 100%; background: linear-gradient(90deg, var(--k-blue), var(--k-yellow)); animation: loaderFill 1.6s cubic-bezier(0.65,0,0.35,1) forwards; }
        @keyframes loaderFill { 0% { width:0%; } 100% { width:100%; } }

        /* ── Drag & Drop (Pilar 2) ── */
        .pt1-dnd-wrap { display: flex; flex-direction: column; gap: 16px; }
        .pt1-dnd-guide {
            display: flex; align-items: center; gap: 12px;
            background: rgba(38,94,155,0.06); border: 1.5px solid rgba(38,94,155,0.14);
            border-radius: 14px; padding: 12px 16px; font-size: 0.88rem;
            font-weight: 700; color: var(--muted);
        }
        .pt1-dnd-guide span { font-size: 1.4rem; }
        .pt1-pool {
            display: flex; flex-wrap: wrap; gap: 10px;
            background: rgba(38,94,155,0.04); border: 2px dashed rgba(38,94,155,0.2);
            border-radius: 16px; padding: 14px; min-height: 64px; align-items: center;
        }
        .pt1-card {
            background: #fff; border: 2.5px solid rgba(38,94,155,0.22);
            border-bottom: 5px solid rgba(38,94,155,0.32);
            border-radius: 14px; padding: 10px 16px; cursor: grab;
            font-size: 1.05rem; font-weight: 800; color: var(--k-blue-d);
            display: flex; align-items: center; gap: 10px;
            transition: all .15s; user-select: none;
        }
        .pt1-card:active { cursor: grabbing; border-bottom-width: 2px; transform: translateY(3px); }
        .pt1-card.pt1-dragging { opacity: 0.35; border-style: dashed; }
        .pt1-card.pt1-placed { opacity: 0.3; pointer-events: none; border-style: dashed; background: #f1f5f9; }
        .pt1-card-icon { font-size: 1.8rem; }

        .pt1-slots { display: flex; flex-direction: column; gap: 10px; }
        .pt1-slot {
            background: #fff; border: 2.5px dashed rgba(38,94,155,0.25);
            border-radius: 14px; padding: 10px 14px; min-height: 58px;
            display: flex; align-items: center; gap: 10px; transition: all .2s;
        }
        .pt1-slot.pt1-dragover { border-color: var(--k-blue); background: rgba(38,94,155,0.08); transform: scale(1.01); }
        .pt1-slot.pt1-filled { border-style: solid; border-color: var(--k-blue); background: rgba(38,94,155,0.06); }
        .pt1-slot-num {
            width: 30px; height: 30px; border-radius: 8px; background: rgba(38,94,155,0.1);
            color: var(--k-blue-d); font-weight: 900; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .pt1-slot.pt1-filled .pt1-slot-num { background: var(--k-blue); color: #fff; }
        .pt1-slot-content { font-size: 0.95rem; font-weight: 800; color: var(--k-blue-d); flex: 1; }
        .pt1-slot-hint { font-size: 0.85rem; color: #94a3b8; font-style: italic; font-weight: 600; }
        .pt1-slot-remove { font-size: 0.9rem; cursor: pointer; color: #ef4444; background: none; border: none; font-weight: 900; padding: 2px 6px; border-radius: 6px; }
        .pt1-dnd-submit {
            background: linear-gradient(180deg, #F9C013 0%, #E5AB00 100%);
            color: #5A3F00; font-family: 'Orbitron', sans-serif; font-weight: 800;
            font-size: 0.9rem; letter-spacing: 0.06em; text-transform: uppercase;
            border: none; padding: 14px 24px; border-radius: 1rem; cursor: pointer;
            transition: all 0.15s ease; box-shadow: 0 6px 0 #B28400;
            margin-top: 4px; width: 100%;
        }
        .pt1-dnd-submit:disabled { opacity: 0.45; cursor: not-allowed; }
        .pt1-dnd-submit:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 0 #B28400; }
        .pt1-dnd-submit:not(:disabled):active { transform: translateY(6px); box-shadow: 0 0 0 #B28400; }
        .pt1-dnd-reset {
            background: transparent; color: var(--muted); border: 1.5px solid rgba(38,94,155,0.2);
            border-radius: 10px; padding: 10px 18px; font-size: 0.85rem; font-weight: 800;
            cursor: pointer; transition: all 0.15s; width: 100%; margin-top: 6px;
        }
        .pt1-dnd-reset:hover { background: rgba(38,94,155,0.06); }
    </style>
</head>
<body>



    <!-- Developer Menu (Floating Panel) -->
    <div id="dev-panel" style="position:fixed; bottom:20px; right:20px; background:rgba(0,0,0,0.85); color:white; padding:16px; border-radius:12px; font-family:'Space Grotesk', sans-serif; z-index:9999; display:flex; flex-direction:column; gap:10px; border:1px solid #334155; font-size:13px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(8px);">
        <div style="font-weight:800; color:#38bdf8; text-align:center; margin-bottom:4px; font-family:'Orbitron', sans-serif; letter-spacing:1px;"><i class="fa-solid fa-code"></i> DEV MODE</div>
        <div style="display:flex; gap:8px; justify-content:center;">
            <button onclick="devPrev()" style="flex:1; padding:8px 12px; cursor:pointer; background:#334155; color:white; border:none; border-radius:6px; font-weight:bold; transition:all 0.2s;" onmouseover="this.style.background='#475569'" onmouseout="this.style.background='#334155'"><i class="fa-solid fa-arrow-left"></i> Prev</button>
            <button onclick="devNext()" style="flex:1; padding:8px 12px; cursor:pointer; background:#334155; color:white; border:none; border-radius:6px; font-weight:bold; transition:all 0.2s;" onmouseover="this.style.background='#475569'" onmouseout="this.style.background='#334155'">Next <i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <button onclick="devToggleAge()" style="padding:8px; cursor:pointer; background:linear-gradient(135deg, #2563eb, #1d4ed8); color:white; border:none; border-radius:6px; font-weight:bold; margin-top:4px;">
            Switch UI to: <span id="dev-age-text">Pro Mode</span>
        </button>
        <button onclick="resetTest()" style="padding:8px; cursor:pointer; background:transparent; color:#ef4444; border:1px solid #ef4444; border-radius:6px; font-weight:bold;"><i class="fa-solid fa-rotate-right"></i> Restart</button>
    </div>

    <!-- Loader -->
    <div id="pt-loader">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/828072b7-9198-4367-bce2-134b9fc8b486.png" class="loader-rocket" alt="Rocket">
        <div class="loader-bar"><div class="loader-progress"></div></div>
        <p style="margin-top:24px; font-family:'Orbitron',sans-serif; font-weight:800; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.3em; color:#265E9B;">Menyiapkan Tes...</p>
    </div>

    <!-- Background Assets -->
    <div class="edge-layer">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/e77f536b-e591-4ba8-b5b8-f5b2a3d3b33b.png" class="edge-planet edge-left" style="top:6%; width:min(22vw,170px);" alt="">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/c08a7aed-567f-4e37-988c-1423a5b92643.png" class="edge-planet edge-left" style="top:65%; width:min(28vw,220px); transform:translateX(-30%);" alt="">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/5f93f855-0466-47b3-ba85-bbaabbad7a2e.png" class="edge-planet edge-right" style="top:20%; width:min(26vw,210px); transform:translateX(30%);" alt="">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/434fc5cb-e490-4e40-a921-d4519aa8a8a4.png" class="edge-planet edge-right" style="bottom:5%; width:min(30vw,250px);" alt="">

            //         if (b[1] !== a[1]) return b[1] - a[1];
            //         return ['logic', 'creativity', 'spatial', 'digital'].indexOf(a[0]) - ['logic', 'creativity', 'spatial', 'digital'].indexOf(b[0]);
            //     })
            //     .map(([pillar]) => pillar)
            //     .filter(pillar => stage1AdvancedQuestions[pillar])
            //     .slice(0, 2);
            state.stage1AdvancedQueue = state.stage1AdvancedPillars.flatMap(pillar => stage1AdvancedQuestions[pillar] || []);
            state.stage1AdvancedPillarScores = { logic: 0, creativity: 0, spatial: 0, digital: 0 };
            state.stage1AdvancedScore = 0;

            // Fallback untuk dev/test jika top pillar belum punya bank penguat.
            if (state.stage1AdvancedQueue.length === 0 && stage1AdvancedQuestions.logic) {
                state.stage1AdvancedPillars = ['logic'];
                state.stage1AdvancedQueue = [...stage1AdvancedQuestions.logic];
            }
        }

        function determineModuleFromStage1Advanced() {
            const answeredPillars = Object.entries(state.stage1AdvancedPillarScores)
                .filter(([pillar]) => state.stage1AdvancedQueue.some(q => q.pillar === pillar))
                .sort((a, b) => {
                    if (b[1] !== a[1]) return b[1] - a[1];
                    return state.stage1AdvancedPillars.indexOf(a[0]) - state.stage1AdvancedPillars.indexOf(b[0]);
                });
            const bestPillar = answeredPillars.length ? answeredPillars[0][0] : getTopStage1Pillars(1)[0];
            state.recommendedModule = state.exactAge < 8 ? 'Scratch Jr' : (stage1AdvancedTargets[bestPillar] || 'Scratch');
        }

        function renderStage1Advanced(container) {
            const useAdvancedBank = state.stage1AdvancedQueue && state.stage1AdvancedQueue.length > 0;
            const questions = useAdvancedBank ? state.stage1AdvancedQueue : (legacyModuleQuestions[state.recommendedModule] || legacyModuleQuestions['Scratch']);
            const q = questions[state.currentQuestionIndex];
            const progress = ((state.currentQuestionIndex) / questions.length) * 100;
            const questionText = useAdvancedBank ? (state.ageGroup === 'kids' ? q.text.kids : q.text.teens) : q.text;
            
            let optionsHtml = '';
            const options = useAdvancedBank ? (state.ageGroup === 'kids' ? q.options.kids : q.options.teens) : q.options;
            options.forEach((opt, idx) => {
                let iconHtml = '';
                let textHtml = opt;
                if(typeof opt === 'object' && opt.icon) {
                    iconHtml = `<div class="emoji-icon">${opt.icon}</div>`;
                    textHtml = opt.text;
                } else if(typeof opt === 'object' && !opt.icon) {
                    textHtml = opt.text;
                } else {
                    iconHtml = `<div class="emoji-icon"><i class="fa-solid fa-code" style="font-size:2rem;color:#818CF8;"></i></div>`;
                }
                optionsHtml += `<button class="option-btn" onclick="answerStage1Advanced(${idx})">${iconHtml}<span>${textHtml}</span></button>`;
            });

            let contentHtml = '';
            if (useAdvancedBank && q.interactiveHtml) {
                const iHtml = state.ageGroup === 'kids' ? q.interactiveHtml.kids : q.interactiveHtml.teens;
                contentHtml = `<div class="interactive-container" style="margin-bottom:20px; padding:20px; background:rgba(255,255,255,0.02); border-radius:15px; border:1px solid rgba(148,163,184,0.1);">${iHtml}</div>`;
            }

            const pillarTitle = state.stage1AdvancedPillars.map(getPillarLabel).join(' & ');
            const title = useAdvancedBank ? `Penguat ${pillarTitle}` : `${state.recommendedModule} Challenge`;
            const badge = useAdvancedBank
                ? `<span class="badge hard"><i class="fa-solid fa-bolt"></i> ${getPillarLabel(q.pillar)}: ${q.focus}</span>`
                : `<span class="badge"><i class="fa-solid fa-layer-group"></i> Soal ${q.tier}</span>`;

            container.innerHTML = `
                <div class="progress-container">
                    <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                    <div class="progress-text"><span>Stage 1: ${title}</span> <span>${state.currentQuestionIndex + 1} / ${questions.length}</span></div>
                </div>
                ${badge}
                <div class="question-text">${questionText}</div>
                ${contentHtml}
                <div class="options-container">${optionsHtml}</div>
            `;
        }

        function renderInterestQuestion(container) {
            let optionsHtml = '';
            interestQuestion.options.forEach((opt) => {
                optionsHtml += `<button class="option-btn" onclick="answerInterestQuestion('${opt.value}')"><i class="fa-solid fa-star"></i> ${opt.text}</button>`;
            });

            container.innerHTML = `
                <div class="progress-container">
                    <div class="progress-bar"><div class="progress-fill" style="width: 100%"></div></div>
                    <div class="progress-text"><span>Minat & Bakat</span> <span>Final</span></div>
                </div>
                <span class="badge"><i class="fa-solid fa-heart"></i> Personalitas</span>
                <div class="question-text">${interestQuestion.text}</div>
                ${optionsHtml}
            `;
        }

        function renderResult(container) {
            const stage1AdvancedTotal = state.stage1AdvancedQueue && state.stage1AdvancedQueue.length ? state.stage1AdvancedQueue.length : 6;
            const stage1AdvancedRatio = stage1AdvancedTotal > 0 ? state.stage1AdvancedScore / stage1AdvancedTotal : 0;

            // Determine level based on Stage 1 penguat score ratio.
            if (stage1AdvancedRatio <= 0.4) {
                state.recommendedLevel = "Level 1 (Fundamental)";
            } else if (stage1AdvancedRatio <= 0.75) {
                state.recommendedLevel = "Level 2 (Intermediate)";
            } else {
                state.recommendedLevel = "Level 3 (Advanced / Akselerasi)";
            }

            // Generate Roadmap Logic
            let roadmapHtml = '';
            if (state.exactAge < 8) {
                roadmapHtml = createRoadmapItem("Scratch Jr", state.recommendedModule === 'Scratch Jr') +
                              `<i class="fa-solid fa-arrow-right roadmap-arrow"></i>` +
                              createRoadmapItem("Scratch", state.recommendedModule === 'Scratch') +
                              `<i class="fa-solid fa-arrow-right roadmap-arrow"></i>` +
                              createRoadmapItem("Roblox Studio", state.recommendedModule === 'Roblox Studio');
            } else if (state.exactAge >= 8 && state.exactAge <= 11) {
                roadmapHtml = createRoadmapItem("Scratch", state.recommendedModule === 'Scratch') +
                              `<i class="fa-solid fa-arrow-right roadmap-arrow"></i>` +
                              createRoadmapItem("Roblox Studio", state.recommendedModule === 'Roblox Studio') +
                              `<i class="fa-solid fa-arrow-right roadmap-arrow"></i>` +
                              createRoadmapItem("Python", state.recommendedModule === 'Python');
            } else {
                roadmapHtml = createRoadmapItem("Roblox Studio", state.recommendedModule === 'Roblox Studio') +
                              `<i class="fa-solid fa-arrow-right roadmap-arrow"></i>` +
                              createRoadmapItem("Python", state.recommendedModule === 'Python') +
                              `<i class="fa-solid fa-arrow-right roadmap-arrow"></i>` +
                              createRoadmapItem("Advanced App Dev", false);
            }

            container.innerHTML = `
                <h1>Misi Selesai! 🎉</h1>
                <div class="result-card">
                    <h2>Rekomendasi Modul</h2>
                    <p>Hebat, <strong>${state.name}</strong>! Berdasarkan hasil tesmu, kamu paling cocok belajar di:</p>
                    <div class="highlight">${state.recommendedModule}</div>
                </div>
                
                <div class="result-card">
                    <h2>Rekomendasi Level</h2>
                    <p>Berdasarkan Stage 1 penguat (Skor: ${state.stage1AdvancedScore}/${stage1AdvancedTotal}), kamu direkomendasikan masuk kelas:</p>
                    <div class="highlight">${state.recommendedLevel}</div>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">Profil Siswa: ${state.preference}</p>
                </div>

                <div class="result-card" style="background: rgba(79, 70, 229, 0.1); border-color: rgba(79, 70, 229, 0.3);">
                    <h2>Learning Plan (Roadmap)</h2>
                    <p style="font-size: 0.9rem; color: #cbd5e1;">Jalur belajarmu ke depannya agar menjadi Pro Coder:</p>
                    <div class="roadmap">
                        ${roadmapHtml}
                    </div>
                </div>

                <button class="btn-main" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Ulangi Tes</button>
            `;
        }

        function createRoadmapItem(name, isActive) {
            return `<div class="roadmap-item ${isActive ? 'active' : ''}">${name} ${isActive ? '📍' : ''}</div>`;
        }

        // --- Actions ---
        
        window.resetTest = function() {
            localStorage.removeItem('pt_state');
            Object.assign(state, {
                name: '',
                emailOrtu: '',
                cabang: '',
                ageGroup: 'kids',
                exactAge: 0,
                currentStage: 0,
                currentQuestionIndex: 0,
                showingPillarIntro: false,
                failedReadingTest: false,
                scores: { logic: 0, creativity: 0, spatial: 0, digital: 0 },
                stage1AdvancedPillars: [],
                stage1AdvancedQueue: [],
                stage1AdvancedPillarScores: { logic: 0, creativity: 0, spatial: 0, digital: 0 },
                stage1AdvancedScore: 0,
                recommendedModule: '',
                recommendedLevel: '',
                preference: ''
            });
            document.body.classList.add('kids-mode');
            document.body.classList.remove('pro-mode');
            render();
        };

        // DEV MODE ACTIONS
        window.devPrev = function() {
            if (state.currentStage === 0) return;
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
            } else if (state.currentStage > 1) {
                state.currentStage--;
                // Go to last question of previous stage
                if (state.currentStage === 1) {
                    state.currentQuestionIndex = stage1Questions.length - 1;
                } else if (state.currentStage === 2) {
                    const questions = state.stage1AdvancedQueue && state.stage1AdvancedQueue.length ? state.stage1AdvancedQueue : (legacyModuleQuestions[state.recommendedModule] || legacyModuleQuestions['Scratch']);
                    state.currentQuestionIndex = questions.length - 1;
                }
            }
            render();
        };

        window.devNext = function() {
            if (state.currentStage === 0) {
                // auto start with dummy data
                document.getElementById('nameInput').value = 'Dev User';
                document.getElementById('ageInput').value = state.ageGroup === 'kids' ? '6' : '16';
                document.getElementById('emailInput').value = 'dev@test.com';
                const cabangSelect = document.getElementById('cabangInput');
                if (cabangSelect.options.length <= 1) {
                    cabangSelect.innerHTML += '<option value="Dev Cabang">Dev Cabang</option>';
                }
                cabangSelect.value = 'Dev Cabang';
                startTest();
                return;
            }
            if (state.currentStage === 1) {
                if (state.currentQuestionIndex < stage1Questions.length - 1) {
                    state.currentQuestionIndex++;
                } else {
                    prepareStage1Advanced();
                    state.currentStage = 2;
                    state.currentQuestionIndex = 0;
                }
            } else if (state.currentStage === 2) {
                const questions = state.stage1AdvancedQueue && state.stage1AdvancedQueue.length ? state.stage1AdvancedQueue : (legacyModuleQuestions[state.recommendedModule] || legacyModuleQuestions['Scratch']);
                if (state.currentQuestionIndex < questions.length - 1) {
                    state.currentQuestionIndex++;
                } else {
                    determineModuleFromStage1Advanced();
                    state.currentStage = 4;
                }
            } else if (state.currentStage === 3) {
                state.currentStage = 4;
            }
            render();
        };

        window.devToggleAge = function() {
            if (state.ageGroup === 'kids') {
                state.ageGroup = 'teens';
                state.exactAge = 15; // Set a mock teens age
                document.body.classList.add('pro-mode');
                document.body.classList.remove('kids-mode');
                document.getElementById('dev-age-text').innerText = 'Kids Mode';
            } else {
                state.ageGroup = 'kids';
                state.exactAge = 7; // Set a mock kids age
                document.body.classList.add('kids-mode');
                document.body.classList.remove('pro-mode');
                document.getElementById('dev-age-text').innerText = 'Pro Mode';
            }
            // Update dropdown if in stage 0
            if (state.currentStage === 0) {
                const ageInput = document.getElementById('ageInput');
                if (ageInput) ageInput.value = state.ageGroup === 'kids' ? '6' : '16';
            }
            render();
        };
        window.speakText = function(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'id-ID';
                window.speechSynthesis.speak(msg);
            }
        };

        window.startTest = function() {
            const name = document.getElementById('nameInput').value.trim();
            const age = document.getElementById('ageInput').value;
            const email = document.getElementById('emailInput').value.trim();
            const cabang = document.getElementById('cabangInput').value;
            
            if(!name || !age || !email || !cabang) {
                alert("Mohon lengkapi semua data (Nama, Umur, Email, dan Cabang) terlebih dahulu ya!");
                return;
            }
            
            // Validasi format email dasar
            const emailRegex = /^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/;
            if (!emailRegex.test(email)) {
                alert("Mohon masukkan alamat email yang valid!");
                return;
            }
            
            state.name = name;
            state.emailOrtu = email;
            state.cabang = cabang;
            state.exactAge = parseInt(age);
            state.ageGroup = state.exactAge <= 8 ? 'kids' : 'teens';
            
            if (state.ageGroup === 'teens') {
                document.body.classList.add('pro-mode');
                document.body.classList.remove('kids-mode');
            } else {
                document.body.classList.add('kids-mode');
                document.body.classList.remove('pro-mode');
            }
            
            state.currentStage = 1;
            state.currentQuestionIndex = 0;
            state.showingPillarIntro = true;
            state.scores = { logic: 0, creativity: 0, spatial: 0, digital: 0 };
            state.stage1AdvancedPillars = [];
            state.stage1AdvancedQueue = [];
            state.stage1AdvancedPillarScores = { logic: 0, creativity: 0, spatial: 0, digital: 0 };
            state.stage1AdvancedScore = 0;
            state.recommendedModule = '';
            state.recommendedLevel = '';
            state.preference = '';
            render();
        }

        // ── Drag & Drop handlers (Pilar Kreativitas) ────────────────────────
        window.pt1DndStart = function(e, id) {
            window._pt1DraggingId = id;
            e.dataTransfer.setData('text/plain', id);
            setTimeout(() => {
                const el = document.querySelector(`.pt1-card[data-id="${id}"]`);
                if (el) el.classList.add('pt1-dragging');
            }, 0);
        };
        window.pt1DndOver = function(e) {
            e.preventDefault();
            e.currentTarget.classList.add('pt1-dragover');
        };
        window.pt1DndLeave = function(e) {
            e.currentTarget.classList.remove('pt1-dragover');
        };
        window.pt1DndDrop = function(e, slotIdx) {
            e.preventDefault();
            e.currentTarget.classList.remove('pt1-dragover');
            const id = e.dataTransfer.getData('text/plain') || window._pt1DraggingId;
            if (!id) return;
            // If slot already filled, swap back to pool (clear slot)
            const dnd = window._pt1Dnd;
            if (dnd.slots[slotIdx] !== null) {
                // no double-fill; ignore
                return;
            }
            dnd.slots[slotIdx] = id;
            render();
        };
        window.pt1DndRemove = function(slotIdx) {
            if (!window._pt1Dnd) return;
            window._pt1Dnd.slots[slotIdx] = null;
            render();
        };
        window.pt1DndReset = function() {
            if (!window._pt1Dnd) return;
            window._pt1Dnd.slots = window._pt1Dnd.slots.map(() => null);
            render();
        };
        window.pt1DndSubmit = function() {
            const q = stage1Questions[state.currentQuestionIndex];
            const dnd = window._pt1Dnd;
            if (!dnd || dnd.slots.some(s => s === null)) return;
            const correctOrder = q.correctOrder[state.ageGroup];
            const isCorrect = dnd.slots.every((id, i) => id === correctOrder[i]);
            if (isCorrect) state.scores[q.pillar]++;
            window._pt1Dnd = null; // reset for next dnd question
            const prevPillar = q.pillar;
            state.currentQuestionIndex++;
            if (state.currentQuestionIndex >= stage1Questions.length) {
                prepareStage1Advanced();
                state.currentStage = state.stage1AdvancedQueue.length > 0 ? 2 : 4;
                if (state.currentStage === 4) determineModule();
                state.currentQuestionIndex = 0;
            } else {
                const nextPillar = stage1Questions[state.currentQuestionIndex].pillar;
                if (prevPillar !== nextPillar) state.showingPillarIntro = true;
            }
            render();
        };

        // Touch drag-and-drop support
        let _touchDragId = null, _touchClone = null;
        window.pt1TouchStart = function(e, id) {
            _touchDragId = id;
            const card = e.currentTarget;
            _touchClone = card.cloneNode(true);
            _touchClone.style.cssText = `position:fixed;opacity:0.85;pointer-events:none;z-index:9999;width:${card.offsetWidth}px;`;
            document.body.appendChild(_touchClone);
            const t = e.touches[0];
            _touchClone.style.left = (t.clientX - card.offsetWidth/2) + 'px';
            _touchClone.style.top  = (t.clientY - 20) + 'px';
            document.addEventListener('touchmove', _pt1TouchMove, { passive: false });
        };
        function _pt1TouchMove(e) {
            e.preventDefault();
            const t = e.touches[0];
            if (_touchClone) {
                _touchClone.style.left = (t.clientX - _touchClone.offsetWidth/2) + 'px';
                _touchClone.style.top  = (t.clientY - 20) + 'px';
            }
        }
        window.pt1TouchEnd = function(e) {
            document.removeEventListener('touchmove', _pt1TouchMove);
            if (_touchClone) { _touchClone.remove(); _touchClone = null; }
            if (!_touchDragId) return;
            const t = e.changedTouches[0];
            const el = document.elementFromPoint(t.clientX, t.clientY);
            const slot = el ? el.closest('.pt1-slot') : null;
            if (slot) {
                const slotIdx = parseInt(slot.dataset.slot);
                if (!isNaN(slotIdx) && window._pt1Dnd.slots[slotIdx] === null) {
                    window._pt1Dnd.slots[slotIdx] = _touchDragId;
                    render();
                }
            }
            _touchDragId = null;
        };
        // ────────────────────────────────────────────────────────────────────

        window.answerStage1 = function(selectedIndex) {

            const q = stage1Questions[state.currentQuestionIndex];
            const correctAns = typeof q.correctIndex === 'object' ? q.correctIndex[state.ageGroup] : q.correctIndex;
            if (selectedIndex === correctAns) {
                state.scores[q.pillar]++;
            }
            
            // Reading filter test for Scratch Jr
            if (q.pillar === 'digital' && state.currentQuestionIndex === 15 && state.ageGroup === 'kids') {
                if (selectedIndex !== correctAns) {
                    state.failedReadingTest = true;
                }
            }
            
            const prevPillar = q.pillar;
            state.currentQuestionIndex++;
            
            if (state.currentQuestionIndex >= stage1Questions.length) {
                prepareStage1Advanced();
                if (state.stage1AdvancedQueue.length > 0) {
                    state.currentStage = 2;
                } else {
                    determineModule();
                    state.currentStage = 4;
                }
                state.currentQuestionIndex = 0;
            } else {
                const nextPillar = stage1Questions[state.currentQuestionIndex].pillar;
                if (prevPillar !== nextPillar) {
                    state.showingPillarIntro = true;
                }
            }
            render();
        }

        function determineModule() {
            let maxScore = -1;
            let bestPillar = '';
            for (const [pillar, score] of Object.entries(state.scores)) {
                if (score > maxScore) { maxScore = score; bestPillar = pillar; }
            }
            
            // Age and Pillar based routing
            if (state.exactAge <= 7) {
                state.recommendedModule = 'Scratch Jr';
            } else if (state.exactAge >= 13 && bestPillar === 'logic') {
                state.recommendedModule = 'Python';
            } else {
                if (bestPillar === 'spatial') state.recommendedModule = 'Roblox Studio';
                else if (bestPillar === 'logic') state.recommendedModule = 'Python';
                else state.recommendedModule = 'Scratch';
            }
        }

        window.answerStage1Advanced = function(selectedIndex) {
            const useAdvancedBank = state.stage1AdvancedQueue && state.stage1AdvancedQueue.length > 0;
            const questions = useAdvancedBank ? state.stage1AdvancedQueue : (legacyModuleQuestions[state.recommendedModule] || legacyModuleQuestions['Scratch']);
            const q = questions[state.currentQuestionIndex];
            const correctAns = useAdvancedBank && typeof q.correctIndex === 'object' ? q.correctIndex[state.ageGroup] : q.correctIndex;

            if (selectedIndex === correctAns) {
                state.stage1AdvancedScore++;
                if (useAdvancedBank && q.pillar) {
                    state.stage1AdvancedPillarScores[q.pillar]++;
                }
            }
            
            state.currentQuestionIndex++;
            if (state.currentQuestionIndex >= questions.length) {
                if (useAdvancedBank) {
                    determineModuleFromStage1Advanced();
                    state.currentStage = 4;
                } else {
                    state.currentStage = 3;
                }
            }
            render();
        }

        window.answerInterestQuestion = function(answerValue) {
            state.preference = answerValue;
            state.currentStage = 4; // Result
            render();
        }

        // Initialize App
        render();
    </script>
</body>
</html>
