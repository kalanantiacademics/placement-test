<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240">
  <!-- Cat is positioned so it stands on the grass, a bit to the right -->
  <g transform="translate(130, 120)">
    <!-- Tail -->
    <path d="M 70 60 Q 100 20 120 40 Q 130 50 110 70 Q 90 50 70 60" fill="#FF8C00"/>
    <!-- Back legs -->
    <rect x="20" y="70" width="12" height="30" rx="5" fill="#FF8C00"/>
    <rect x="60" y="70" width="12" height="30" rx="5" fill="#FF8C00"/>
    <!-- Body -->
    <ellipse cx="45" cy="65" rx="40" ry="25" fill="#FFA500"/>
    <!-- Stripes on body -->
    <path d="M 20 45 L 25 60 M 45 40 L 45 55 M 70 45 L 65 60" stroke="#FF4500" stroke-width="3" stroke-linecap="round"/>
    <!-- Front legs -->
    <rect x="10" y="75" width="12" height="30" rx="5" fill="#FFA500"/>
    <rect x="50" y="75" width="12" height="30" rx="5" fill="#FFA500"/>
    <!-- Head -->
    <circle cx="15" cy="40" r="22" fill="#FFA500"/>
    <!-- Ears -->
    <polygon points="0,25 10,10 20,22" fill="#FF8C00"/>
    <polygon points="15,22 25,10 32,25" fill="#FF8C00"/>
    <!-- Eyes -->
    <circle cx="5" cy="35" r="4" fill="white"/>
    <circle cx="5" cy="35" r="2" fill="black"/>
    <circle cx="20" cy="35" r="4" fill="white"/>
    <circle cx="20" cy="35" r="2" fill="black"/>
    <!-- Nose -->
    <polygon points="10,42 15,42 12.5,45" fill="pink"/>
    <!-- Whiskers -->
    <line x1="5" y1="42" x2="-5" y2="40" stroke="black" stroke-width="1"/>
    <line x1="5" y1="44" x2="-5" y2="45" stroke="black" stroke-width="1"/>
    <line x1="20" y1="42" x2="30" y2="40" stroke="black" stroke-width="1"/>
    <line x1="20" y1="44" x2="30" y2="45" stroke="black" stroke-width="1"/>
  </g>
</svg>
