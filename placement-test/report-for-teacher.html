            letter-spacing: 0.04em;

        .teen-section {
            display: flex;
            flex-direction: column;

            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 6px 16px rgba(38, 94, 155, 0.06);

        .teen-section h2 {

            color: #17324f;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.96rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .teen-section p {
            color: #365d83;
            font-size: 0.78rem;
            line-height: 1.45;
            font-weight: 600;
        }

        /* PROFILE LAYOUT: RADAR CHART & PILLARS */

        .teen-pillar-head {
            display: flex;
            align-items: center;

        .teen-pillar-head strong {

            font-size: 0.82rem;

        .teen-band {

        .pillar-body {

        .report-pillar-narrative .pillar-item:last-child {

            border-bottom: 0;
            margin-bottom: 0;
        }

        .report-pillar-narrative .pillar-item p {

            color: #365d83 !important;
            line-height: 1.4 !important;
        }

        .report-pillar-advice > span {
            color: #704f00;
            font-weight: 850;
        }

        .report-pillar-advice p {
            color: #594508 !important;
            line-height: 1.4 !important;
        }

        .tag-good {
            display: inline-block;
            font-weight: 850;
            color: #1e615b;
        }

        .tag-grow {
            display: inline-block;
            font-weight: 850;
            color: #866200;
        }

        /* OVERALL INSIGHT GRID */
        .report-overall-insight {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 12px;
        }

        .report-overall-insight div {
            padding: 14px 16px;
            border-radius: 14px;
            background: #eff6ff;
            border: 1px solid #c8ddf2;
            color: #365d83;
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .report-overall-insight div:last-child {
            background: #fff8df;
            border-color: #efd06b;
        }

        .report-overall-insight strong {
            display: block;
            margin-bottom: 4px;
            color: #17324f;
        }

        /* EVIDENCE & CHALLENGE CARDS */
        .report-evidence-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 10px;
        }

        .report-evidence-card, .report-challenge-card, .report-interest-row {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .report-evidence-card {
            padding: 16px;
            border: 1px solid #c8ddf2;
            border-radius: 16px;
            background: #fff;
        }

        .report-evidence-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        .report-evidence-head strong {
            font-family: 'Orbitron', sans-serif;
            color: #17324f;
        }

        .report-evidence-head span {
            font-size: 0.75rem;
            font-weight: 800;
            color: #265e9b;
        }

        .report-evidence-label {
            margin: 12px 0 6px !important;
            font-size: 0.74rem !important;
            font-weight: 800;
            color: #4d6f91 !important;
        }

        .report-evidence-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .report-evidence-chip, .report-evidence-empty {
            display: inline-flex;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 750;
            line-height: 1.3;
        }

        .report-evidence-chip.is-correct {
            background: #eaf8f3;
            color: #1e615b;
            border: 1px solid #a3d9d3;
        }

        .report-evidence-chip.is-growth {
            background: #fff4dc;
            color: #866200;
            border: 1px solid #efd06b;
        }

        .report-evidence-empty {
            background: #f1f5f9;
            color: #64748b;
            border: 1px dashed #cbd5e1;
        }

        .report-stage-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .report-stage-summary div {
            padding: 12px 14px;
            border-radius: 12px;
            background: #eff6ff;
            text-align: center;
        }

        .report-stage-summary strong {
            display: block;
            color: #265e9b;
            font-size: 1.05rem;
        }

        .report-stage-summary span {
            font-size: 0.68rem;
            color: #4d6f91;
        }

        .report-challenge-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .report-challenge-card {
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #c8ddf2;
            background: #fff;
        }

        .report-challenge-card > div {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .report-challenge-card > div span {
            font-size: 0.68rem;
            color: #64748b;
        }

        .report-challenge-card > b {
            display: inline-block;
            margin: 8px 0 4px;
            color: #1e615b;
        }

        .report-challenge-card.is-stop > b {
            color: #866200;
        }

        .report-challenge-card p {
            margin: 0 !important;
            line-height: 1.4 !important;
        }

        .report-interest-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .report-interest-row {
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #c8ddf2;
        }

        .report-interest-row > span {
            display: grid;
            width: 26px;
            height: 26px;
            place-items: center;
            border-radius: 50%;
            background: #265e9b;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 900;
        }

        .report-interest-row strong {
            display: block;
            color: #17324f;
            font-size: 0.74rem;
            line-height: 1.35;
        }

        .report-interest-row p {
            margin: 4px 0 0 !important;
            color: #2b6a61 !important;
            line-height: 1.35 !important;
        }

        .report-voice {
            padding: 14px 16px;
            border-left: 4px solid #f9c013;
            border-radius: 0 12px 12px 0;
            background: #fff8df;
            font-style: italic;
            color: #594508;
            margin: 12px 0 14px;
        }

        /* CONTINUATION BANNER */
        .teen-print-continuation {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            border: 1.5px solid #265e9b;
            border-radius: 14px;
            background: #173f73;
            color: #ffffff;
        }

        .teen-print-continuation strong {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
        }

        .teen-print-continuation span {
            font-size: 0.68rem;
            font-weight: 800;
            color: #f9c013;
            letter-spacing: 0.05em;
        }

        /* TWO COLUMNS */
        .teen-two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .teen-priority {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
            padding-left: 18px;
            color: #365d83;
            font-size: 0.76rem;
            line-height: 1.4;
            font-weight: 600;
        }

        /* LEARNING PATH COMPONENTS */
        .teen-path-name {
            display: inline-block;
            margin: 4px 0 8px;
            padding: 4px 14px;
            border: 1px dashed #265e9b;
            border-radius: 12px;
            background: #fff7d6;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
            color: #265e9b;
            text-align: center;
        }

        .teen-current-module {
            display: flex;
            width: max-content;
            max-width: 100%;
            align-items: center;
            gap: 6px;
            margin: 0 0 10px;
            padding: 4px 12px;
            border: 1.5px solid #f0b400;
            border-radius: 999px;
            background: #fff9d8;
            color: #704f00;
            font-size: 0.72rem;
            font-weight: 850;
        }

        .teen-current-module strong {
            color: #17324f;
        }

        .teen-track {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 4px 0 8px;
        }

        .teen-track-step {
            position: relative;
            flex: 1 1 0;
            min-width: 0;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border: 2px solid #7f96ad;
            border-radius: 999px;
            background: #ffffff;
            color: #17324f;
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.76rem;
            font-weight: 850;
        }

        .teen-track-step.is-assigned {
            border-color: #f0a800;
            background: linear-gradient(135deg, #ffe45c, #f9c013);
            color: #4b3500;
            box-shadow: 0 8px 20px rgba(240, 168, 0, 0.28);
        }

        .teen-track-step.is-assigned::after {
            content: '✓';
            position: absolute;
            top: -7px;
            right: 12px;
            display: grid;
            width: 22px;
            height: 22px;
            place-items: center;
            border: 2px solid #ffffff;
            border-radius: 50%;
            background: #22a06b;
            color: #ffffff;
            font-size: 0.68rem;
            font-weight: 900;
            box-shadow: 0 4px 8px rgba(34, 160, 107, 0.25);
        }

        .teen-track-arrow {
            flex: 0 0 auto;
            color: #7f96ad;
            font-size: 1.1rem;
            font-weight: 900;
        }

        .teen-report-note {
            display: block;
            margin-top: 6px;
            padding-top: 5px;
            border-top: 1px dashed #cbd5e1;
            font-size: 0.65rem;
            line-height: 1.25;
            color: #475569;
        }

        /* =========================================================
           PRINT STYLES FOR FULL A4 OUTPUT
           ========================================================= */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                background: none !important;
                padding: 0 !important;
                display: block !important;
            }

            .screen-toolbar {
                display: none !important;
            }

            .a4-container {
                width: 210mm !important;
                min-height: 297mm !important;
                height: auto !important;
                margin: 0 !important;
                padding: 14mm 16mm 16mm 16mm !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
        }
    </style>
</head>

                        'Koordinat': { strong: 'menentukan lokasi pada titik koordinat X-Y', grow: 'pemetaan koordinat X-Y' },
                        'Bangun Ruang': { strong: 'menghitung volume & susunan blok 3D', grow: 'volume & susunan ruang 3D' },
                        'Relasi': { strong: 'memahami batas area (hitbox) & relasi objek', grow: 'relasi & batas area objek' }
                    }
                },
                digital: {
                    label: 'Literasi Digital',
                    skills: {
                        'Hardware & Input': { strong: 'menggunakan mouse & keyboard secara presisi', grow: 'keterampilan input mouse/keyboard' },
                        'Ikon UI': { strong: 'mengenali fungsi simbol & ikon antarmuka', grow: 'pengenalan simbol & ikon UI' },
                        'Struktur Data': { strong: 'memahami hirarki file, folder, & media', grow: 'organisasi file & folder' },
                        'Troubleshooting': { strong: 'menangani kendala teknis sederhana', grow: 'troubleshooting teknis mandiri' },
                        'File System': { strong: 'menavigasi lokasi penyimpanan secara teratur', grow: 'navigasi sistem direktori' }
                    }
                }
            };

            const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
            const safeArray = value => Array.isArray(value) ? value : [];
            const clamp = value => Math.max(0, Math.min(1, Number(value) || 0));

            function getReportData() {
                const customData = window.reportData || window.PlacementReportData || {};
                const params = new URLSearchParams(window.location.search);
                const student = customData.student || {};

                const name = String(customData.studentName || student.name || params.get('name') || 'Siswa').trim();
                const age = Number(customData.age || student.exactAge || student.age || params.get('age') || 16);
                const reportDate = customData.reportDate || params.get('date') || new Date().toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });
                const assignedModule = String(customData.assignedModule || params.get('module') || 'Python');
                const level = String(customData.level || params.get('level') || 'Level 1');
                const pathName = String(customData.pathName || params.get('path') || 'Interactive Creator Path');
                const lv3Candidate = Boolean(customData.lv3Candidate || params.get('lv3') === 'true');
                const evidence = customData.assessmentEvidence || {};

                const rawScores = customData.scores || {};
                const scores = {
                    logic: clamp(rawScores.logic ?? 0.8),
                    creativity: clamp(rawScores.creativity ?? 0.4),
                    spatial: clamp(rawScores.spatial ?? 0.8),
                    digital: clamp(rawScores.digital ?? 0.6)
                };

                return {
                    name, age, reportDate, assignedModule, level, pathName, lv3Candidate, evidence, scores,
                    learningModules: safeArray(customData.learningModules).length
                        ? safeArray(customData.learningModules)
                        : ['Scratch', 'Roblox Studio', 'Python']
                };
            }

            function renderFullTeacherReport() {
                const data = getReportData();
                const { name, age, reportDate, assignedModule, level, pathName, lv3Candidate, evidence, scores, learningModules } = data;

                const pillarOrder = ['logic', 'creativity', 'spatial', 'digital'];
                const sortedPillars = Object.entries(scores).sort((a, b) => b[1] - a[1]);
                const topKey = sortedPillars[0]?.[0] || 'logic';
                const bottomKey = sortedPillars[sortedPillars.length - 1]?.[0] || 'digital';
                const topName = MASTER_SKILL_MAP[topKey].label;
                const bottomName = MASTER_SKILL_MAP[bottomKey].label;

                const metaTag = 'TEACHER EVALUATION &amp; GUIDANCE REPORT';
                const statusText = lv3Candidate
                    ? 'KANDIDAT REVIEW EMERGING — Lv3'
                    : level.startsWith('FOUNDATIONAL')
                        ? 'DIREKOMENDASIKAN MEMBANGUN FONDASI'
                        : 'SIAP MENGEMBANGKAN KEMAMPUAN MELALUI PROYEK';

                const mainSubtitle = `${escapeHtml(name)} direkomendasikan memulai <strong>${escapeHtml(assignedModule)}</strong> pada <strong>${escapeHtml(level)}</strong>. Laporan ini menyajikan evaluasi komprehensif 5 halaman bagi Teacher untuk memahami bukti kemampuan, tantangan spesifik, dan panduan latihan terarah.`;

                function getBandInfo(ratio) {
                    if (ratio >= 0.8) return { label: 'Kekuatan Utama', bg: '#eaf8f3', color: '#1e615b' };
                    if (ratio >= 0.65) return { label: 'Berkembang Baik', bg: '#eff6ff', color: '#265e9b' };
                    if (ratio >= 0.45) return { label: 'Sedang Bertumbuh', bg: '#fff8e1', color: '#866200' };
                    return { label: 'Perlu Pendampingan', bg: '#fff1f2', color: '#9f1239' };
                }

                // RADAR CHART SVG
                const cx = 360, cy = 265, r = 185;
                const l = scores.logic, c = scores.creativity, s = scores.spatial, d = scores.digital;
                const svgChart = `
                <svg width="100%" height="100%" viewBox="0 0 720 535" style="display:block;margin:0 auto;max-width:650px">
                    <polygon points="${cx},${cy-r} ${cx+r},${cy} ${cx},${cy+r} ${cx-r},${cy}" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
                    ${[0.75, 0.5, 0.25].map(scale => `<polygon points="${cx},${cy-r*scale} ${cx+r*scale},${cy} ${cx},${cy+r*scale} ${cx-r*scale},${cy}" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>`).join('')}
                    <line x1="${cx}" y1="${cy-r}" x2="${cx}" y2="${cy+r}" stroke="#cbd5e1" stroke-width="2"/>
                    <line x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="#cbd5e1" stroke-width="2"/>
                    <polygon points="${cx},${cy-r*l} ${cx+r*c},${cy} ${cx},${cy+r*s} ${cx-r*d},${cy}" fill="rgba(38,94,155,.25)" stroke="#265e9b" stroke-width="3.5" stroke-linejoin="round"/>
                    ${[[cx,cy-r*l],[cx+r*c,cy],[cx,cy+r*s],[cx-r*d,cy]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="7" fill="#f9c013" stroke="#fff" stroke-width="2.5"/>`).join('')}
                    <text x="${cx}" y="${cy-r-16}" text-anchor="middle" font-family="'Orbitron',sans-serif" font-size="16" font-weight="800" fill="#17324f">LOGIKA</text>
                    <text x="${cx+r+16}" y="${cy+5}" text-anchor="start" font-family="'Orbitron',sans-serif" font-size="16" font-weight="800" fill="#17324f">KREATIVITAS</text>
                    <text x="${cx}" y="${cy+r+30}" text-anchor="middle" font-family="'Orbitron',sans-serif" font-size="16" font-weight="800" fill="#17324f">SPASIAL</text>
                    <text x="${cx-r-16}" y="${cy+5}" text-anchor="end" font-family="'Orbitron',sans-serif" font-size="16" font-weight="800" fill="#17324f">DIGITAL</text>
                </svg>`;

                // NARRATIVE BUILDER PER PILLAR
                const pillarNarratives = {
                    logic: {
                        demonstrated: 'mengenali pola, menyusun urutan algoritma, dan memilih aturan logika yang tepat',
                        growth: 'menjaga ketelitian ketika alur program makin panjang serta melakukan debugging alur error secara mandiri',
                        advice: 'Gunakan metode latihan Prediksi–Jalankan–Cek: minta siswa memperkirakan hasil kodenya terlebih dahulu, menjalankan langkah, lalu menjelaskan bagian yang perlu diperbaiki sebelum mencoba ulang.'
                    },
                    creativity: {
                        demonstrated: 'membaca hubungan visual antarmuka dan mengembangkan variasi pilihan desain',
                        growth: 'menyusun hierarki visual, kontras warna, layout UI, atau animasi frame agar ide lebih mudah dipahami',
                        advice: 'Berikan proyek kecil dengan satu tujuan visual yang jelas, lalu ajak siswa membandingkan dua versi karya dan menjelaskan alasan pemilihan warna, posisi, atau animasinya.'
                    },
                    spatial: {
                        demonstrated: 'memahami arah rotasi, posisi titik koordinat X-Y, dan hubungan relasi antarobjek',
                        growth: 'membayangkan perubahan sudut pandang perspektif 3D serta batas area hitbox dengan lebih konsisten',
                        advice: 'Latih dengan grid visual, panah arah, dan objek 3D yang diputar bertahap. Setelah itu, minta siswa memprediksi posisi akhir sebelum melihat hasil di layar.'
                    },
                    digital: {
                        demonstrated: 'menggunakan antarmuka software, perangkat input keyboard/mouse, dan struktur file',
                        growth: 'menangani kendala teknis (troubleshooting) dan menavigasi menu software secara mandiri',
                        advice: 'Biasakan prosedur cek mandiri 3 langkah: identifikasi masalah teknis, periksa perangkat/menu terkait, lalu coba satu solusi sebelum bertanya ke mentor.'
                    }
                };

                const pillarCardsHtml = pillarOrder.map(key => {
                    const score = scores[key];
                    const band = getBandInfo(score);
                    const copy = pillarNarratives[key];
                    return `
                    <article class="teen-pillar">
                        <div class="teen-pillar-head">
                            <strong>${MASTER_SKILL_MAP[key].label}</strong>
                            <span class="teen-band" style="background:${band.bg};color:${band.color};border:1px solid ${band.color}">${band.label}</span>
                        </div>
                        <div class="pillar-body report-pillar-narrative">
                            <div class="pillar-item"><span class="tag-good">✓ Kemampuan yang terlihat:</span><p>${copy.demonstrated}</p></div>
                            <div class="pillar-item"><span class="tag-grow">↗ Yang perlu dibangun:</span><p>${copy.growth}</p></div>
                            <div class="pillar-item report-pillar-advice"><span>💡 Panduan Teacher &amp; Saran Latihan:</span><p>${escapeHtml(copy.advice)}</p></div>
                        </div>
                    </article>`;
                }).join('');

                const stage1DetailHtml = pillarOrder.map(key => {
                    return `
                    <article class="report-evidence-card">
                        <div class="report-evidence-head">
                            <strong>${MASTER_SKILL_MAP[key].label}</strong>
                            <span>Jejak Kemampuan</span>
                        </div>
                        <p class="report-evidence-label">✓ Kemampuan terkonfirmasi konsisten</p>
                        <div class="report-evidence-chips"><span class="report-evidence-chip is-correct">✓ Pemahaman Konsep Dasar</span><span class="report-evidence-chip is-correct">✓ Pengenalan Pola Utama</span></div>
                        <p class="report-evidence-label">↗ Area latihan lanjutan teacher</p>
                        <div class="report-evidence-chips"><span class="report-evidence-chip is-growth">↗ Penguatan Alur Kompleks</span></div>
                    </article>`;
                }).join('');

                const whyLevelText = level.startsWith('FOUNDATIONAL')
                    ? `${escapeHtml(name)} ditempatkan pada Level 1 untuk memastikan fondasi pemikiran komputasional (logika, variabel, dan percabangan) benar-benar kokoh sebelum melangkah ke pembuatan proyek ${escapeHtml(assignedModule)} yang lebih bebas.`
                    : `${escapeHtml(name)} ditempatkan pada Level 2 karena telah menunjukkan kesiapan praktis pada tantangan awal. Fokus pendampingan teacher adalah melatih kemandirian siswa dalam menyelesaikan masalah tanpa terlalu banyak petunjuk teknis.`;

                const studentReason = String(evidence.stage3?.reason || 'Suka membuat proyek interaktif dan berminat mengembangkan logika koding.');

                const learningTrackHtml = learningModules.map((module, index) => {
                    const isAssigned = module === assignedModule;
                    return `${index ? '<span class="teen-track-arrow" aria-hidden="true">→</span>' : ''}<div class="teen-track-step${isAssigned ? ' is-assigned' : ''}">${index + 1}. ${escapeHtml(module)}</div>`;
                }).join('');

                const focusListHtml = [
                    'Membimbing algoritma & pseudocode sebelum mengetik kode',
                    'Memperkuat pemahaman perulangan (looping) dan pengondisian',
                    'Melatih kebiasaan membaca pesan error (debugging mandiri)'
                ].map(skill => `<li>${escapeHtml(skill)}.</li>`).join('');

                const container = document.getElementById('reportPaper');
                container.innerHTML = `
                <!-- PAGE 1: EVALUASI KESELURUHAN & PROFIL KEMAMPUAN -->
                <section class="report-page">
                    <header class="teen-report-head">
                        <div class="report-space-art" aria-hidden="true">
                            <svg viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="reportSky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102d56"/><stop offset=".58" stop-color="#265e9b"/><stop offset="1" stop-color="#2d8fb5"/></linearGradient>
                                    <pattern id="reportStars" width="92" height="92" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r="2" fill="#fff" opacity=".68"/><circle cx="70" cy="36" r="1.4" fill="#f9c013" opacity=".9"/></pattern>
                                </defs>
                                <rect width="1000" height="420" fill="url(#reportSky)"/>
                                <rect width="1000" height="420" fill="url(#reportStars)"/>
                            </svg>
                            <img class="report-art-planet" src="https://cdn-web-2.ruangguru.com/landing-pages/assets/e77f536b-e591-4ba8-b5b8-f5b2a3d3b33b.png" alt="">
                            <img class="report-art-planet-right" src="https://cdn-web-2.ruangguru.com/landing-pages/assets/5f93f855-0466-47b3-ba85-bbaabbad7a2e.png" alt="">
                        </div>
                        <div class="teen-report-brand">
                            <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/545c0426-169c-406f-8775-93afcacef50a.png" alt="Kalananti Logo">
                            <span class="teen-report-meta">${metaTag}<br>${escapeHtml(reportDate)} · USIA ${age} TAHUN</span>
                        </div>
                        <span class="teen-report-status">${statusText}</span>
                        <h1>Profil Potensi dan Evaluasi Detail Siswa</h1>
                        <div class="report-student-name">${escapeHtml(name)}</div>
                        <div class="teen-report-placement">
                            <span class="teen-module">${escapeHtml(assignedModule)}</span>
                            <span class="teen-level">${escapeHtml(level)}</span>
                        </div>
                        <p class="subtitle">${mainSubtitle}</p>
                    </header>

                    <section class="teen-section">
                        <h2>Analisis Kemampuan &amp; Spider Chart Siswa</h2>
                        <div class="teen-profile-layout report-profile-chart-only">
                            <div class="teen-profile-chart">${svgChart}</div>
                        </div>
                        <div class="report-overall-insight">
                            <div><strong>Kekuatan Paling Konsisten</strong>Pilar <strong>${escapeHtml(topName)}</strong> paling sering menunjukkan bukti kemampuan yang stabil. Manfaatkan pilar ini sebagai pemantik rasa percaya diri siswa.</div>
                            <div><strong>Fokus Perkembangan Utama</strong>Pilar <strong>${escapeHtml(bottomName)}</strong> membutuhkan perhatian &amp; latihan terarah dari Teacher agar ketidakpastian siswa dapat teratasi.</div>
                        </div>
                    </section>
                </section>

                <!-- PAGE 2: INTERPRETASI HASIL & PANDUAN TEACHER PER PILAR -->
                <section class="report-page report-page-break">
                    <div class="teen-print-continuation">
                        <strong>Rangkuman Kemampuan &amp; Panduan Teacher per Pilar</strong>
                        <span>BUKTI · TANTANGAN · SARAN</span>
                    </div>
                    <section class="teen-section">
                        <h2>Interpretasi Hasil &amp; Panduan Latihan (${escapeHtml(name)})</h2>
                        <p>Penjelasan rinci berikut membantu Teacher memahami bukti kemampuan yang sudah terlihat, tantangan spesifik siswa, serta strategi pendampingan terbaik di kelas.</p>
                        <div class="teen-pillar-grid">${pillarCardsHtml}</div>
                    </section>
                </section>

                <!-- PAGE 3: JEJAK JAWABAN STAGE 1 (EVIDENCE BREAKDOWN) -->
                <section class="report-page report-page-break">
                    <div class="teen-print-continuation">
                        <strong>Jejak Kemampuan &amp; Evidence Stage 1</strong>
                        <span>1A DASAR · 1B PENGUAT</span>
                    </div>
                    <section class="teen-section">
                        <h2>Analisis Evidence Jawaban per Pilar</h2>
                        <p>Jejak jawaban ini membantu Teacher mengidentifikasi topik mana yang sudah dikuasai siswa dan topik mana yang memerlukan pengulangan konsep.</p>
                        <div class="report-evidence-grid">${stage1DetailHtml}</div>
                    </section>
                </section>

                <!-- PAGE 4: RASIONAL LEVEL & STAGE 2 MASTERY -->
                <section class="report-page report-page-break">
                    <div class="teen-print-continuation">
                        <strong>Rasional Penempatan Level &amp; Practice Stage 2</strong>
                        <span>BATAS PENGUASAAN MODUL</span>
                    </div>
                    <section class="teen-section">
                        <h2>Mengapa Mulai dari Level Ini?</h2>
                        <div class="report-stage-summary">
                            <div><strong>${escapeHtml(assignedModule)}</strong><span>Modul Rekomendasi</span></div>
                            <div><strong>${escapeHtml(level)}</strong><span>Level Terkonfirmasi</span></div>
                            <div><strong>3</strong><span>Challenge Teruji</span></div>
                            <div><strong>${escapeHtml(level)}</strong><span>Batas Mastery</span></div>
                        </div>
                        <p>${whyLevelText}</p>
                    </section>
                    <div class="teen-two-col">
                        <section class="teen-section">
                            <h2>Fokus Pendampingan Teacher</h2>
                            <ul class="teen-priority">${focusListHtml}</ul>
                        </section>
                        <section class="teen-section">
                            <h2>Potensi Perkembangan Berikutnya</h2>
                            <p>Setelah menguasai modul ${escapeHtml(assignedModule)} pada level ini, siswa disiapkan untuk melangkah ke tantangan proyek mandiri yang lebih bebas.</p>
                        </section>
                    </div>
                </section>

                <!-- PAGE 5: SUARA SISWA & LEARNING PATH -->
                <section class="report-page report-page-break">
                    <div class="teen-print-continuation">
                        <strong>Observasi Minat Siswa &amp; Rencana Learning Path</strong>
                        <span>STAGE 3 · MINAT &amp; GUIDANCE</span>
                    </div>
                    <section class="teen-section" style="background:#eef8f5;border-color:#8bcfc5">
                        <h2>Catatan Minat &amp; Suara Siswa</h2>
                        <p>Minat eksplisit siswa membantu Teacher menentukan konteks proyek yang menarik bagi siswa saat sesi pembelajaran.</p>
                        <p class="report-voice"><strong>Komentar/Alasan Siswa:</strong> “${escapeHtml(studentReason)}”</p>
                    </section>
                    <section class="teen-section">
                        <h2>Learning Path ${escapeHtml(name)}</h2>
                        <div class="teen-path-name">${escapeHtml(pathName)}</div>
                        <div class="teen-current-module"><span>✦ Modul rekomendasi saat ini: <strong>${escapeHtml(assignedModule)}</strong></span></div>
                        <div class="teen-track">${learningTrackHtml}</div>
                        <p style="margin-top:8px"><strong>${escapeHtml(pathName)}</strong> menjelaskan alur perjalanan belajar siswa. Teacher disarankan menyelaraskan proyek akhir siswa dengan minat utamanya.</p>
                    </section>
                    <p class="teen-report-note">Catatan Teacher: Hasil placement ini digunakan sebagai acuan awal titik mulai belajar. Evaluasi siswa dapat disesuaikan kembali berdasarkan hasil observasi mentor pada 2 pertemuan pertama.</p>
                </section>

                <footer class="report-footer">CREATED BY KALANANTI ACADEMICS · EVALUATION &amp; TEACHER GUIDE · © 2026</footer>`;
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', renderFullTeacherReport);
            } else {
                renderFullTeacherReport();
            }
        })();
    </script>
</body>
</html>
