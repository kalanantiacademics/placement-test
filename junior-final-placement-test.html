  <script data-placement-session-client>
    (function placementSessionBootstrap(global) {
      'use strict';

      const nativeStorage = global.localStorage;
      const TAB_SESSION_KEY = 'pt_tab_submission_id';
      const LAST_SESSION_KEY = 'placement_last_submission_id_v1';
      const SESSION_PREFIX = 'pt_session::';
      const REGISTRY_PREFIX = 'pt_registration::';
      let activeSubmissionId = '';
      let installed = false;

      function isPlacementKey(key) {
        return key === 'placement_test_build_version'
          || key.startsWith('pt_')
          || key.startsWith('kalananti-');
      }

      function scopedPrefix(submissionId = activeSubmissionId) {
        return `${SESSION_PREFIX}${submissionId}::`;
      }

      function scopedKey(key) {
        return isPlacementKey(key) && activeSubmissionId
          ? `${scopedPrefix()}${key}`
          : key;
      }

      function visibleKeys() {
        const keys = [];
        const prefix = scopedPrefix();
        for (let index = 0; index < nativeStorage.length; index += 1) {
          const key = nativeStorage.key(index);
          if (!key) continue;
          if (activeSubmissionId && key.startsWith(prefix)) {
            keys.push(key.slice(prefix.length));
          } else if (!key.startsWith(SESSION_PREFIX) && !key.startsWith(REGISTRY_PREFIX) && !isPlacementKey(key)) {
            keys.push(key);
          }
        }
        return [...new Set(keys)];
      }

      const facade = {
        get length() {
          return visibleKeys().length;
        },
        key(index) {
          return visibleKeys()[index] ?? null;
        },
        getItem(key) {
          return nativeStorage.getItem(scopedKey(String(key)));
        },
        setItem(key, value) {
          nativeStorage.setItem(scopedKey(String(key)), String(value));
        },
        removeItem(key) {
          nativeStorage.removeItem(scopedKey(String(key)));
        },
        clear() {
          if (!activeSubmissionId) return;
          const prefix = scopedPrefix();
          const removals = [];
          for (let index = 0; index < nativeStorage.length; index += 1) {
            const key = nativeStorage.key(index);
            if (key?.startsWith(prefix)) removals.push(key);
          }
          removals.forEach(key => nativeStorage.removeItem(key));
        }
      };

      function installFacade() {
        if (installed) return;
        Object.defineProperty(global, 'localStorage', {
          configurable: false,
          enumerable: true,
          value: facade
        });
        installed = true;
      }

      function activate(submissionId) {
        const cleanId = String(submissionId || '').trim();
        if (!cleanId) return false;
        activeSubmissionId = cleanId;
        global.sessionStorage.setItem(TAB_SESSION_KEY, cleanId);
        nativeStorage.setItem(LAST_SESSION_KEY, cleanId);
        installFacade();

        const registration = nativeStorage.getItem(`${REGISTRY_PREFIX}${cleanId}`);
        if (registration && !facade.getItem('pt_student_registration')) {
          facade.setItem('pt_student_registration', registration);
          facade.setItem('pt_student_profile', registration);
        }
        return true;
      }

      function create(registration) {
        const submissionId = String(registration?.submissionId || '').trim();
        if (!submissionId) throw new Error('missing_submission_id');
        nativeStorage.setItem(`${REGISTRY_PREFIX}${submissionId}`, JSON.stringify(registration));
        activate(submissionId);
        facade.setItem('pt_student_registration', JSON.stringify(registration));
        facade.setItem('pt_student_profile', JSON.stringify(registration));
        return submissionId;
      }

      function destroyCurrent() {
        if (!activeSubmissionId) return false;
        const submissionId = activeSubmissionId;
        facade.clear();
        nativeStorage.removeItem(`${REGISTRY_PREFIX}${submissionId}`);
        global.sessionStorage.removeItem(TAB_SESSION_KEY);
        if (nativeStorage.getItem(LAST_SESSION_KEY) === submissionId) {
          nativeStorage.removeItem(LAST_SESSION_KEY);
        }
        activeSubmissionId = '';
        return true;
      }

      function getActiveSubmissionId() {
        return activeSubmissionId;
      }

      global.PlacementSession = {
        activate,
        create,
        destroyCurrent,
        getActiveSubmissionId
      };

      let requestedSession = null;
      try {
        const params = new URLSearchParams(global.location.search);
        requestedSession = params.get('sid')
          || global.sessionStorage.getItem(TAB_SESSION_KEY)
          || nativeStorage.getItem(LAST_SESSION_KEY);
      } catch (e) { }

      if (!requestedSession) {
        try {
          if (!global.parent || global.parent === global || !global.parent.PlacementSession) throw new Error('parent_session_unavailable');
          requestedSession = global.parent.PlacementSession.getActiveSubmissionId();
        } catch (e) { }
      }

      if (requestedSession) activate(requestedSession);
    })(window);

  </script>
  <script data-placement-sync-client>
    (function placementSyncBootstrap(global) {
      'use strict';

      const CONFIG = {
        webAppUrl: String(
          global.PLACEMENT_WEB_APP_URL
          || 'https://script.google.com/macros/s/AKfycbxYga6HmAaTkAjVnwMX-AVJ7shYdg8JWeiLfcExhV0Lv1y6lxL0qr0oQIvYQkaLRznh/exec'
        ).trim(),
        queueKey: 'pt_sync_queue_v1',
        tokenKey: 'pt_sync_token_v1',
        cleanupKey: 'pt_cleanup_after_v1',
        cleanupDelayMs: 2 * 60 * 60 * 1000,
        retryDelayMs: 15 * 1000
      };

      let retryTimer = null;
      const reportPdfCache = new WeakMap();
      const visualFinalizeRetryTimers = new Map();
      const html2PdfLoads = new WeakMap();
      const HTML2PDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';

      function readJson(key, fallback = null) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch (error) {
          return fallback;
        }
      }

      function writeJson(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function randomToken() {
        if (global.crypto?.randomUUID) return global.crypto.randomUUID();
        return `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
      }

      function getRegistration() {
        return readJson('pt_student_registration') || readJson('pt_student_profile');
      }

      function getSubmissionId() {
        const registration = getRegistration();
        return registration?.submissionId || registration?.student?.submissionId || '';
      }

      function getSyncToken() {
        let token = localStorage.getItem(CONFIG.tokenKey);
        if (!token) {
          token = randomToken();
          localStorage.setItem(CONFIG.tokenKey, token);
        }
        return token;
      }

      function getQueue() {
        return readJson(CONFIG.queueKey, []);
      }

      function setQueue(queue) {
        writeJson(CONFIG.queueKey, queue);
      }

      function queueOperation(action, payload, options = {}) {
        touchSessionExpiry();
        const submissionId = options.submissionId || getSubmissionId() || payload?.submissionId;
        if (!submissionId) return Promise.resolve({ queued: false, reason: 'missing_submission_id' });

        const queue = getQueue();
        const rawRevision = options.revision || payload?.revision || Date.now();
        const numericRevision = Number(rawRevision);
        const parsedRevision = Date.parse(String(rawRevision));
        const revision = Number.isFinite(numericRevision)
          ? numericRevision
          : Number.isFinite(parsedRevision)
            ? parsedRevision
            : Date.now();
        const operation = {
          operationId: `${submissionId}:${action}:${options.stage || payload?.stage || 'session'}:${revision}`,
          action,
          submissionId,
          syncToken: getSyncToken(),
          stage: options.stage || payload?.stage || null,
          revision,
          payload,
          queuedAt: new Date().toISOString(),
          attempts: 0
        };

        const existingIndex = queue.findIndex(item => item.operationId === operation.operationId);
        if (existingIndex >= 0) queue[existingIndex] = operation;
        else queue.push(operation);
        setQueue(queue);
        return flush();
      }

      async function send(operation) {
        if (!CONFIG.webAppUrl) return { ok: false, queued: true, reason: 'web_app_url_not_configured' };
        const response = await fetch(CONFIG.webAppUrl, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(operation)
        });
        if (!response.ok) throw new Error(`sync_http_${response.status}`);
        const result = await response.json();
        if (!result?.ok) throw new Error(result?.error || 'sync_rejected');
        return result;
      }

      async function flush() {
        if (!CONFIG.webAppUrl) return { ok: false, queued: getQueue().length, reason: 'web_app_url_not_configured' };
        const queue = getQueue();
        if (!queue.length) return { ok: true, queued: 0 };

        const remaining = [];
        let lastResult = null;
        for (const operation of queue) {
          try {
            lastResult = await send(operation);
            if (operation.action === 'finalize' && lastResult?.finalized) scheduleCleanup();
          } catch (error) {
            remaining.push({
              ...operation,
              attempts: Number(operation.attempts || 0) + 1,
              lastAttemptAt: new Date().toISOString(),
              lastError: String(error?.message || error)
            });
          }
        }
        setQueue(remaining);
        if (remaining.length) scheduleRetry();
        return { ok: remaining.length === 0, queued: remaining.length, lastResult };
      }

      function scheduleRetry() {
        if (retryTimer || !CONFIG.webAppUrl) return;
        retryTimer = global.setTimeout(async () => {
          retryTimer = null;
          await flush();
        }, CONFIG.retryDelayMs);
      }

      function scheduleCleanup() {
        const cleanupAt = Date.now();
        localStorage.setItem(CONFIG.cleanupKey, String(cleanupAt));
        global.setTimeout(clearCompletedSessionIfDue, 250);
      }

      function touchSessionExpiry() {
        const cleanupAt = Date.now() + CONFIG.cleanupDelayMs;
        localStorage.setItem(CONFIG.cleanupKey, String(cleanupAt));
        global.setTimeout(clearCompletedSessionIfDue, CONFIG.cleanupDelayMs + 250);
      }

      function clearCompletedSessionIfDue() {
        const cleanupAt = Number(localStorage.getItem(CONFIG.cleanupKey));
        if (!cleanupAt || Date.now() < cleanupAt || getQueue().length) return false;

        if (global.PlacementSession?.destroyCurrent) {
          return global.PlacementSession.destroyCurrent();
        }

        const keysToRemove = [];
        for (let index = 0; index < localStorage.length; index += 1) {
          const key = localStorage.key(index);
          if (key && (key.startsWith('pt_') || key.startsWith('kalananti-'))) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));
        return true;
      }

      function register(registration) {
        return queueOperation('register', registration, {
          submissionId: registration?.submissionId,
          revision: registration?.timestamp || Date.now()
        });
      }

      function saveStage(stage, payload, status = 'completed') {
        return queueOperation('save_stage', {
          stage,
          status,
          data: payload,
          savedAt: new Date().toISOString()
        }, {
          stage,
          revision: payload?.revision || payload?.completedAt || Date.now()
        });
      }

      function checkpoint(stage, payload) {
        return saveStage(stage, payload, 'in_progress');
      }

      function finalize(payload) {
        return queueOperation('finalize', {
          ...payload,
          completedAt: payload?.completedAt || new Date().toISOString()
        }, {
          revision: payload?.completedAt || Date.now()
        });
      }

      function loadHtml2Pdf(targetDocument = document) {
        const targetWindow = targetDocument.defaultView || global;
        if (typeof targetWindow.html2pdf === 'function') {
          return Promise.resolve(targetWindow.html2pdf);
        }
        const pending = html2PdfLoads.get(targetDocument);
        if (pending) return pending;

        const promise = new Promise((resolve, reject) => {
          const existing = targetDocument.querySelector('script[data-placement-html2pdf]');
          const script = existing || targetDocument.createElement('script');
          const onLoad = () => {
            if (typeof targetWindow.html2pdf === 'function') resolve(targetWindow.html2pdf);
            else reject(new Error('html2pdf_unavailable'));
          };
          script.addEventListener('load', onLoad, { once: true });
          script.addEventListener('error', () => reject(new Error('html2pdf_load_failed')), { once: true });
          if (!existing) {
            script.dataset.placementHtml2pdf = 'true';
            script.src = HTML2PDF_URL;
            script.crossOrigin = 'anonymous';
            targetDocument.head.appendChild(script);
          }
        }).catch(error => {
          html2PdfLoads.delete(targetDocument);
          throw error;
        });

        html2PdfLoads.set(targetDocument, promise);
        return promise;
      }

      function collectPrintCss(sourceDocument = document) {
        const rules = [];
        const sourceWindow = sourceDocument.defaultView || global;
        for (const sheet of Array.from(sourceDocument.styleSheets || [])) {
          let cssRules;
          try {
            cssRules = sheet.cssRules;
          } catch (error) {
            continue;
          }
          for (const rule of Array.from(cssRules || [])) {
            if (
              rule.type === sourceWindow.CSSRule?.MEDIA_RULE
              && String(rule.conditionText || '').toLowerCase().includes('print')
            ) {
              for (const childRule of Array.from(rule.cssRules || [])) {
                rules.push(childRule.cssText);
              }
            }
          }
        }
        return rules.join('\n');
      }

      function nextPaint(targetWindow = global) {
        const requestFrame = targetWindow.requestAnimationFrame?.bind(targetWindow)
          || global.requestAnimationFrame.bind(global);
        return new Promise(resolve => requestFrame(
          () => requestFrame(resolve)
        ));
      }

      function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
          reader.onerror = () => reject(reader.error || new Error('pdf_read_failed'));
          reader.readAsDataURL(blob);
        });
      }

      function settleWithin(promise, timeoutMs = 5000) {
        return Promise.race([
          Promise.resolve(promise).catch(() => undefined),
          new Promise(resolve => global.setTimeout(resolve, timeoutMs))
        ]);
      }

      function waitForReportAssets(reportElement) {
        if (!reportElement) return Promise.resolve();
        const images = Array.from(reportElement.querySelectorAll('img'));
        const pending = images
          .filter(img => !img.complete)
          .map(img => new Promise(resolve => {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
          }));
        return settleWithin(Promise.all(pending), 5000);
      }

      async function rasterizeProfileCharts(reportElement) {
        if (!reportElement) return () => { };
        const chartContainers = Array.from(
          reportElement.querySelectorAll('.rc-profile-chart, .teen-profile-chart, .kids-profile-chart')
        );
        if (!chartContainers.length) return () => { };

        const chartWindow = reportElement.ownerDocument?.defaultView || global;
        const restoredItems = [];

        for (const container of chartContainers) {
          const svg = container.querySelector('svg');
          if (!svg) continue;
          try {
            const svgString = new chartWindow.XMLSerializer().serializeToString(svg);
            const svgBlob = new chartWindow.Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = chartWindow.URL.createObjectURL(svgBlob);
            const img = new chartWindow.Image();
            img.crossOrigin = 'anonymous';

            await new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = reject;
              img.src = url;
            });

            const rect = container.getBoundingClientRect();
            const dpr = chartWindow.devicePixelRatio || 2;
            const width = Math.max(Math.round(rect.width || 320), 1);
            const height = Math.max(Math.round(rect.height || 240), 1);

            const canvas = reportElement.ownerDocument.createElement('canvas');
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.style.display = 'block';
            canvas.style.margin = '0 auto';

            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.drawImage(img, 0, 0, width, height);

            chartWindow.URL.revokeObjectURL(url);
            svg.replaceWith(canvas);

            restoredItems.push(() => {
              if (canvas.isConnected) canvas.replaceWith(svg);
            });
          } catch (e) {
            console.warn('SVG rasterization failed, retaining live vector chart.', e);
          }
        }

        return () => restoredItems.forEach(restore => restore());
      }

      async function createReportPdf(options = {}) {
        const frameDoc = document.getElementById('frame')?.contentDocument || document.querySelector('iframe')?.contentDocument;
        const sourceDocument = options.document?.querySelector
          ? options.document
          : (frameDoc || document);

        let report = options.element || (
          typeof options.selector === 'string'
            ? sourceDocument.querySelector(options.selector)
            || document.querySelector(options.selector)
            || (frameDoc ? frameDoc.querySelector(options.selector) : null)
            : null
        );

        // If reportData or report-all template requested or report missing, build report-all.html container
        if (options.reportData || options.useReportAllTemplate || !report) {
          report = buildReportAllElement(options.reportData || options, sourceDocument);
        }

        if (reportPdfCache.has(report)) return reportPdfCache.get(report);

        const reportDocument = report.ownerDocument || sourceDocument;
        const reportWindow = reportDocument.defaultView || global;
        const filename = String(options.filename || 'Laporan Placement Test Kalananti.pdf');
        const promise = (async () => {
          const html2Pdf = await loadHtml2Pdf(reportDocument);

          const offscreenContainer = reportDocument.createElement('div');
          offscreenContainer.className = 'placement-pdf-sandbox placement-pdf-exporting';
          offscreenContainer.style.cssText = 'position:fixed;left:-9999px;top:0;width:794px;z-index:-9999;background:#e8f2ff;overflow:visible;display:block!important;';

          const reportClone = report.cloneNode(true);
          reportClone.classList.add('placement-pdf-exporting');
          offscreenContainer.appendChild(reportClone);
          reportDocument.body.appendChild(offscreenContainer);

          const exportStyle = installPdfExportStyle(reportDocument, reportClone);
          let restoreCharts = () => { };
          try {
            if (reportDocument.fonts?.ready) {
              await settleWithin(reportDocument.fonts.ready, 5000);
            }
            await waitForReportAssets(reportClone);
            await nextPaint(reportWindow);
            restoreCharts = await rasterizeProfileCharts(reportClone);
            await nextPaint(reportWindow);
            const isKidsReport = reportClone.classList.contains('kids-report');
            const isTeensReport = reportClone.classList.contains('teen-report');
            const isJuniorReport = (
              reportClone.classList.contains('placement-report') && !isKidsReport
            );
            const isFullBleedReport = isKidsReport || isTeensReport || isJuniorReport;
            const captureWindowWidth = Math.max(
              960,
              Number(reportWindow.innerWidth) || 0,
              Number(reportDocument.documentElement?.scrollWidth) || 0,
              Number(reportDocument.body?.scrollWidth) || 0
            );
            const isMultiPageDocument = Boolean(reportClone.querySelector('.a4-page, .report-page-break'));
            const containerWidthPx = reportClone.offsetWidth || 794;
            const containerHeightPx = reportClone.offsetHeight || reportClone.scrollHeight || 1000;
            const pxToMm = 210 / containerWidthPx;
            const contentHeightMm = Math.max(297, Math.ceil(containerHeightPx * pxToMm) + 10);

            const jsPdfFormat = isMultiPageDocument
              ? 'a4'
              : [210, contentHeightMm];

            const pagebreakConfig = isMultiPageDocument
              ? {
                mode: ['css', 'legacy'],
                before: '.report-page-break',
                avoid: [
                  '.teen-report-head',
                  '.teen-pillar',
                  '.report-evidence-card',
                  '.report-challenge-card',
                  '.report-interest-row'
                ]
              }
              : { mode: [] };

            const worker = html2Pdf().set({
              margin: 0,
              filename,
              image: { type: 'jpeg', quality: 0.98 },
              html2canvas: {
                scale: 2,
                useCORS: true,
                allowTaint: false,
                backgroundColor: '#e8f2ff',
                logging: false,
                imageTimeout: 15000,
                scrollX: 0,
                scrollY: 0,
                windowWidth: captureWindowWidth
              },
              jsPDF: {
                unit: 'mm',
                format: jsPdfFormat,
                orientation: 'portrait',
                compress: true
              },
              pagebreak: pagebreakConfig
            }).from(reportClone);
            const generatedBlob = await worker.toPdf().outputPdf('blob');
            if (!(generatedBlob instanceof reportWindow.Blob) || generatedBlob.size < 1000) {
              throw new Error('invalid_generated_pdf');
            }
            const blob = generatedBlob instanceof global.Blob
              ? generatedBlob
              : new global.Blob(
                [await generatedBlob.arrayBuffer()],
                { type: 'application/pdf' }
              );
            return { blob, filename };
          } finally {
            restoreCharts();
            exportStyle.remove();
            offscreenContainer.remove();
          }
        })();

        reportPdfCache.set(report, promise);
        promise.catch(() => reportPdfCache.delete(report));
        return promise;
      }

      async function downloadReportPdf(options = {}) {
        const generated = await createReportPdf(options);
        const url = URL.createObjectURL(generated.blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = generated.filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        global.setTimeout(() => URL.revokeObjectURL(url), 1000);
        return { downloaded: true, filename: generated.filename, size: generated.blob.size };
      }

      async function finalizeWithReport(payload, options = {}) {
        const retryKey = `${getSubmissionId() || 'session'}:${options.filename || 'report'}`;
        try {
          const generated = await createReportPdf(options);
          const base64 = await blobToBase64(generated.blob);
          if (!base64) throw new Error('empty_pdf_attachment');
          const pendingRetry = visualFinalizeRetryTimers.get(retryKey);
          if (pendingRetry) {
            global.clearTimeout(pendingRetry);
            visualFinalizeRetryTimers.delete(retryKey);
          }
          return await finalize({
            ...payload,
            pdfAttachment: {
              filename: generated.filename,
              mimeType: 'application/pdf',
              base64
            }
          });
        } catch (error) {
          console.error('[Placement PDF] Lampiran visual belum siap; laporan PDF belum dapat disinkronkan dan akan dicoba ulang.', error);
          localStorage.setItem('pt_pdf_generation_error_v1', JSON.stringify({
            message: String(error?.message || error),
            recordedAt: new Date().toISOString()
          }));
          if (!visualFinalizeRetryTimers.has(retryKey)) {
            const timer = global.setTimeout(() => {
              visualFinalizeRetryTimers.delete(retryKey);
              finalizeWithReport(payload, options);
            }, CONFIG.retryDelayMs);
            visualFinalizeRetryTimers.set(retryKey, timer);
          }
          return { finalized: false, queued: false, reason: 'visual_pdf_generation_failed' };
        }
      }

      function configure(options = {}) {
        const requestedUrl = typeof options.webAppUrl === 'string'
          ? options.webAppUrl.trim()
          : '';
        if (requestedUrl) CONFIG.webAppUrl = requestedUrl;
        clearCompletedSessionIfDue();
        if (CONFIG.webAppUrl) flush();
      }

      global.PlacementSync = {
        configure,
        register,
        saveStage,
        checkpoint,
        finalize,
        finalizeWithReport,
        buildReportAllElement,
        createReportPdf,
        downloadReportPdf,
        flush,
        clearCompletedSessionIfDue,
        getQueue,
        getSubmissionId
      };

      global.addEventListener('online', flush);
      clearCompletedSessionIfDue();
    })(window);

  </script>

  <script>
    const PLACEMENT_BUILD_VERSION = 'placement-resume-2026-07-24-v1';

    function resetPlacementForFreshBuild() {
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && (key.startsWith('pt_') || key.startsWith('kalananti-'))) {
          keysToRemove.push(key);
        }
      }
      keysToRemove.forEach(key => localStorage.removeItem(key));
    }

    function clearCurrentPlacementSession() {
      const destroyed = window.PlacementSession?.destroyCurrent?.() === true;
      sessionStorage.removeItem("pt_result_shown_submission_id_v1");
      if (destroyed) return;
      resetPlacementForFreshBuild();
      sessionStorage.removeItem("pt_tab_submission_id");
    }

    function finishPlacementSession() {
      clearCurrentPlacementSession();
      location.replace("index.html");
    }

    function getCurrentPlacementSubmissionId() {
      try {
        return String(
          window.PlacementSession?.getActiveSubmissionId?.()
          || new URLSearchParams(location.search).get("sid")
          || sessionStorage.getItem("pt_tab_submission_id")
          || ""
        ).trim();
      } catch (error) {
        return "";
      }
    }

    function markPlacementResultShown() {
      const submissionId = getCurrentPlacementSubmissionId();
      if (submissionId) {
        sessionStorage.setItem("pt_result_shown_submission_id_v1", submissionId);
      }
      localStorage.setItem("pt_result_shown", "true");
      try {
        const rawRegistration = localStorage.getItem("pt_student_registration")
          || localStorage.getItem("pt_student_profile");
        if (!rawRegistration) return;
        const registration = JSON.parse(rawRegistration);
        registration.isCompleted = true;
        registration.completedAt = registration.completedAt || new Date().toISOString();
        const serialized = JSON.stringify(registration);
        localStorage.setItem("pt_student_registration", serialized);
        localStorage.setItem("pt_student_profile", serialized);
      } catch (error) { }
    }

    (function installPlacementRefreshPolicy() {
      const versionKey = 'placement_test_build_version';
      localStorage.setItem(versionKey, PLACEMENT_BUILD_VERSION);
      const localQcResult =
        /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)
        && (
          new URLSearchParams(location.search).get("qcStage3") === "1"
          || new URLSearchParams(location.search).get("qcResult") === "1"
        );
      if (localQcResult) return;
      const submissionId = getCurrentPlacementSubmissionId();
      const resultShownSubmissionId =
        sessionStorage.getItem("pt_result_shown_submission_id_v1");
      let registrationCompleted = false;
      let stage3Completed = false;
      try {
        const rawRegistration = localStorage.getItem("pt_student_registration")
          || localStorage.getItem("pt_student_profile");
        const registration = rawRegistration ? JSON.parse(rawRegistration) : null;
        registrationCompleted = registration?.isCompleted === true;
      } catch (error) { }
      try {
        const stage3 = JSON.parse(
          localStorage.getItem("kalananti-stage3-junior-interest-v1")
          || "null"
        );
        stage3Completed = stage3?.completed === true || stage3?.screen === "result";
      } catch (error) { }
      const completedResultExists =
        localStorage.getItem("pt_result_shown") === "true"
        || Boolean(submissionId && resultShownSubmissionId === submissionId)
        || registrationCompleted
        || Boolean(localStorage.getItem("pt_junior_final_result"))
        || stage3Completed;
      // Every completed signal above can only exist before this document loads
      // if the result was already reached in an earlier page lifecycle.
      if (!completedResultExists) return;
      document.documentElement.style.visibility = "hidden";
      finishPlacementSession();
    })();
  </script>

    function renderStudentIdentity() {
      const registration = readStorage("pt_student_registration") || readStorage("pt_student_profile");
      const stage1 = readStorage("pt_state_junior") || {};
      const student = registration?.student || registration || {};
      const name = String(student.name || stage1.name || "").trim();
      const stage1Age = Number(stage1.exactAge);
      const age = Number.isFinite(Number(student.exactAge)) ? Number(student.exactAge) : stage1Age;
      const identityName = !/^(?:developer junior|dev student)$/i.test(name) ? name : "";
      const identity = [
        identityName,
        Number.isFinite(age) ? age + " tahun" : "Junior · 5–7 tahun"
      ].filter(Boolean).join(" · ");
      document.getElementById("studentChip").textContent = identity || "Junior · 5–7 tahun";
    }

    function decodeDocument(value) {
      const bytes = Uint8Array.from(atob(value), character => character.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function readStorage(key) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : null;
      } catch (error) {
        return null;
      }
    }

    function openStage(stage, qc = false) {
      if (stage === 3 && !qc) {
        note.classList.add("visible");
        return;
      }
      activeStage = stage;
      localStorage.setItem("pt_active_stage_junior", String(stage));
      stage2Wired = false;
      frame.srcdoc = decodeDocument(DOCUMENTS["stage" + stage]);
      try {
        document.querySelectorAll('.step').forEach((el, i) => {
          const stepNum = i + 1;
          el.classList.toggle('active', stepNum === stage);
          el.classList.toggle('done', stepNum < stage);
        });
      } catch (e) { }
    }

      const result = readStorage(STAGE_1_STORAGE);

      openStage(2);

      function getBand(score) {

          emergingApproved: false
        },
        learningPath: {
          name: learningPath.name,
          modules: learningPath.modules
        },
        completedAt
      };
      localStorage.setItem(
        "pt_junior_final_result",
        JSON.stringify(finalResult)
      );

      const stage3Payload = {
        audience: "junior",
        answers: stage3.answers || [],
        responses: stage3.responses || [],
        reason: stage3.reason || "",
        confirmedInterest,
        completedAt
      };
      const localQcResult =
        /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)
        && (
          new URLSearchParams(location.search).get("qcStage3") === "1"
          || new URLSearchParams(location.search).get("qcResult") === "1"
        );
      if (!localQcResult) {
        window.PlacementSync?.saveStage(3, stage3Payload);
      }
      markPlacementResultShown();

      let registration = null;
      try {
        const rawRegistration =
          localStorage.getItem("pt_student_registration")
          || localStorage.getItem("pt_student_profile");
        registration = rawRegistration ? JSON.parse(rawRegistration) : null;
      } catch (error) { }
      const finalizeStudent = registration?.student || registration || {};
      const finalizePayload = {
        parentEmail:
          finalizeStudent.parentEmail
          || finalizeStudent.emailOrtu
          || stage1.emailOrtu
          || "",
        result: {
          assignedModule:
            stage1.recommendedModule
            || stage1.assignedModule
            || "Scratch Jr",
          potentialModule: stage1.potentialModule || "",
          assignedLevel:
            stage2.assignedLevel
            || "Level 1",
          lv3Candidate: stage2.lv3Candidate === true,
          learningPathName: learningPath.name,
          learningPathModules: learningPath.modules
        },
        completedAt
      };
      const reportFilename = `Laporan Placement Test - ${name}.pdf`;
      const reportPdfOptions = {
        useReportAllTemplate: true,
        reportData: {
          audience: "junior",
          studentName: name || "Siswa",
          age: Number(finalizeStudent.exactAge || finalizeStudent.age || stage1.exactAge || 6),
          reportDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }),
          assignedModule: stage1.recommendedModule || stage1.assignedModule || "Scratch Jr",
          potentialModule: stage1.potentialModule || "",
          level: stage2.assignedLevel || "Level 1",
          lv3Candidate: stage2.lv3Candidate === true,
          pathName: learningPath?.name || "Interactive Creator Path",
          learningModules: learningPath?.modules || ["Scratch", "Roblox Studio", "Python"],
          confirmedInterest,
          scoreScale: "raw5",
          scores: stage1.scores || stage1.pillarScores || {},
          assessmentEvidence: {
            stage1A: {
              answers: stage1.stage1AnswerTrail || []
            },
            stage1B: {
              selectedPillars: stage1.stage1AdvancedPillars || [],
              answers: stage1.stage1AdvancedAnswerTrail || []
            },
            stage2,
            stage3: {
              answers: stage3.answers || [],
              responses: stage3.responses || [],
              confirmedInterest,
              reason: stage3.reason || ""
            }
          }
        },
        filename: reportFilename
      };
      if (localQcResult) {
        console.info(
          "[Placement QA] Finalisasi remote dan pengiriman email dinonaktifkan."
        );
      } else if (window.PlacementSync?.finalizeWithReport) {
        window.PlacementSync.finalizeWithReport(
          finalizePayload,
          reportPdfOptions
        );
      } else {
        window.PlacementSync?.finalize(finalizePayload);
      }

      document.querySelectorAll(".step").forEach((element, index) => {
        const stepNumber = index + 1;
        element.classList.toggle("active", stepNumber === 4);
        element.classList.toggle("done", stepNumber < 4);
      });

      doc.documentElement.dataset.finalFlowWired = "true";
      if (button) button.dataset.finalFlowWired = "true";
      else {
        const fakeBtn = doc.createElement('button');
        fakeBtn.id = 'restart-button';
        fakeBtn.style.display = 'none';
        fakeBtn.dataset.finalFlowWired = "true";
        doc.body.appendChild(fakeBtn);
      }
    }

    function juniorStage1RuntimePatch() {
      if (window.__juniorStage1V1Patched) return;
      if (typeof state === 'undefined' || typeof stage1AdvancedQuestions === 'undefined'
        || typeof render !== 'function' || typeof answerStage1 !== 'function'
        || typeof answerStage1Advanced !== 'function') return;

      window.prepareStage1Advanced = function() {
        const scores = state.scores || {};
        const exceptionalPillars = ['logic', 'creativity', 'digital'];
        const exceptionalValidator = exceptionalPillars.every(
          pillar => Number(scores[pillar] || 0) === 5
        );
        const standardPriority = ['logic', 'creativity', 'spatial'];
        const pillars = exceptionalValidator
          ? exceptionalPillars
          : standardPriority
              .map((pillar, priority) => ({ pillar, priority, score: Number(scores[pillar] || 0) }))
              .sort((left, right) => right.score - left.score || left.priority - right.priority)
              .slice(0, 2)
              .map(item => item.pillar);
        state.stage1AdvancedMode = exceptionalValidator
          ? 'exceptional_three_pillar'
          : 'standard_top_two';
        state.stage1AdvancedPillars = pillars;
        state.stage1AdvancedQueue = pillars
          .flatMap(pillar => stage1AdvancedQuestions[pillar] || [])
          .filter(question => question && question.pillar);
        state.stage1AdvancedPillarScores = { logic: 0, creativity: 0, spatial: 0, digital: 0 };
        state.stage1AdvancedScore = 0;
        state.stage1AdvancedAnswers = {};
        state.stage1AdvancedAnswerTrail = [];
      };
      window.renderStage1Advanced = function(container) {
        const questions = state.stage1AdvancedQueue || [];
        const question = questions[state.currentQuestionIndex];
        if (!question) {
          determineModuleFromStage1Advanced();
          state.currentStage = 4;
          render();
          return;
        }
        const labels = { logic: 'Logika', creativity: 'Kreativitas', spatial: 'Spasial', digital: 'Literasi Digital' };
        const questionText = typeof question.text === 'string'
          ? question.text
          : (question.text?.junior || question.text?.kids || '');
        const options = Array.isArray(question.options)
          ? question.options
          : (question.options?.junior || question.options?.kids || []);
        const interactiveHtml = typeof question.interactiveHtml === 'string'
          ? question.interactiveHtml
          : (question.interactiveHtml?.junior || question.interactiveHtml?.kids || '');
        const progress = questions.length ? (state.currentQuestionIndex / questions.length) * 100 : 0;
        const optionHtml = options.map((option, index) => {
          const icon = typeof option === 'object' ? (option.icon || '⭐') : '⭐';
          const text = typeof option === 'object' ? (option.text || '') : option;
          return `<button class="option-btn" onclick="answerStage1Advanced(${index})"><div class="emoji-icon">${icon}</div><span>${text}</span></button>`;
        }).join('');
        container.innerHTML = `
          <div class="progress-container">
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
            <div class="progress-text"><span>Stage 1B · ${labels[question.pillar] || question.pillar}</span><span>${state.currentQuestionIndex + 1} / ${questions.length}</span></div>
          </div>
          <span class="badge"><i class="fa-solid fa-star"></i> Soal Penguat ${labels[question.pillar] || question.pillar}</span>
          <div class="question-text">${questionText}</div>
          ${interactiveHtml ? `<div class="interactive-container" style="margin-bottom:20px">${interactiveHtml}</div>` : ''}
          <div class="options-container">${optionHtml}</div>`;
      };
      window.determineModuleFromStage1Advanced = function() {
        const scores = state.scores || {};
        const stage1APerfectForScratchPotential = ['logic', 'creativity', 'digital']
          .every(pillar => Number(scores[pillar] || 0) === 5);
        const stage1BPerfect = state.stage1AdvancedQueue?.length > 0
          && Number(state.stage1AdvancedScore || 0) === state.stage1AdvancedQueue.length;
        const scratchPotentialValidated = state.stage1AdvancedMode === 'exceptional_three_pillar'
          && stage1APerfectForScratchPotential
          && stage1BPerfect;

        state.recommendedModule = 'Scratch Jr';
        state.assignedModule = 'Scratch Jr';
        state.potentialModule = scratchPotentialValidated ? 'Scratch' : 'Scratch Jr';
        state.stage2AssessmentId = 'scratchjr-stage2-scaffold-v1';
        state.stage1APerfect = ['logic', 'creativity', 'spatial', 'digital']
          .every(pillar => Number(scores[pillar] || 0) === 5);
        state.stage1BPerfect = stage1BPerfect;
        state.fallbackReason = scratchPotentialValidated
          ? 'Potensi Scratch tervalidasi, tetapi Scratch Jr tetap menjadi fondasi V1 untuk jalur Junior.'
          : 'Scratch Jr tetap menjadi fondasi V1 yang sesuai untuk jalur Junior.';
      };

      stage1QuestionTimer.clear();
      const storageKey = 'pt_question_timer_deadline_v1';
      let activeKey = '';
      let revealTimer = null;
      let autoTimer = null;
      let skipAction = null;
      const timerDelay = (defaultMs, queryName) => {
        let search = location.search;
        try { search = window.parent.location.search; } catch (error) {}
        const value = Number(new URLSearchParams(search).get(queryName));
        return value > 0 ? value : defaultMs;
      };
      const ensureButton = () => {
        let button = document.getElementById('juniorTimedSkipButton');
        if (button) return button;
        button = document.createElement('button');
        button.id = 'juniorTimedSkipButton';
        button.type = 'button';
        button.textContent = 'Lewati Soal';
        button.style.cssText = 'display:none;position:fixed;right:22px;bottom:22px;z-index:12000;padding:12px 18px;border:0;border-radius:999px;background:#ef4444;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(127,29,29,.28)';
        button.onclick = () => {
          if (!confirm('Lewati soal ini? Nilainya akan 0 dan tes lanjut ke soal berikutnya.')) return;
          const action = skipAction;
          clear();
          action?.();
        };
        document.body.appendChild(button);
        return button;
      };
      const clear = (removeDeadline = true) => {
        clearTimeout(revealTimer);
        clearTimeout(autoTimer);
        revealTimer = null;
        autoTimer = null;
        activeKey = '';
        skipAction = null;
        const button = document.getElementById('juniorTimedSkipButton');
        if (button) button.style.display = 'none';
        if (removeDeadline) localStorage.removeItem(storageKey);
      };
      const arm = (key, onSkip) => {
        if (activeKey === key) return;
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(storageKey) || 'null'); } catch (error) {}
        clear(false);
        activeKey = key;
        skipAction = onSkip;
        const now = Date.now();
        const deadline = saved?.key === key && Number(saved.autoAt) > now
          ? saved
          : { key, skipAt: now + timerDelay(60000, 'qcSkipMs'), autoAt: now + timerDelay(120000, 'qcAutoMs') };
        localStorage.setItem(storageKey, JSON.stringify(deadline));
        const button = ensureButton();
        const reveal = () => { if (activeKey === key) button.style.display = 'block'; };
        const skipRemaining = Math.max(0, Number(deadline.skipAt) - now);
        if (skipRemaining === 0) reveal();
        else revealTimer = setTimeout(reveal, skipRemaining);
        autoTimer = setTimeout(() => {
          if (activeKey !== key) return;
          const action = skipAction;
          clear();
          action?.();
        }, Math.max(0, Number(deadline.autoAt) - now));
      };
      const patchedSyncStage1QuestionTimer = function() {
        if (state.currentStage === 1 && !state.showingPillarIntro) {
          arm(`1a:${state.currentQuestionIndex}`, () => answerStage1(-999));
        } else if (state.currentStage === 2) {
          arm(`1b:${state.currentQuestionIndex}`, () => answerStage1Advanced(-999));
        } else {
          clear();
        }
      };
      syncStage1QuestionTimer = patchedSyncStage1QuestionTimer;
      window.syncStage1QuestionTimer = patchedSyncStage1QuestionTimer;
      syncStage1QuestionTimer();
      window.__juniorStage1V1Patched = true;
    }

    function juniorStage2RuntimePatch() {
      if (window.__juniorStage2V1Patched) return;
      if (typeof state === 'undefined' || typeof render !== 'function'
        || typeof routeAfterQuestion !== 'function' || typeof persistProgress !== 'function') return;
      const storageKey = 'pt_stage2_question_deadline_v1';
      let activeKey = '';
      let revealTimer = null;
      let autoTimer = null;
      const timerDelay = (defaultMs, queryName) => {
        let search = location.search;
        try { search = window.parent.location.search; } catch (error) {}
        const value = Number(new URLSearchParams(search).get(queryName));
        return value > 0 ? value : defaultMs;
      };
      const ensureButton = () => {
        let button = document.getElementById('juniorStage2TimedSkip');
        if (button) return button;
        button = document.createElement('button');
        button.id = 'juniorStage2TimedSkip';
        button.type = 'button';
        button.textContent = 'Lewati Tantangan';
        button.style.cssText = 'display:none;position:fixed;right:22px;bottom:22px;z-index:12000;padding:12px 18px;border:0;border-radius:999px;background:#ef4444;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(127,29,29,.28)';
        button.onclick = () => {
          if (confirm('Lewati tantangan ini? Tantangan dianggap belum berhasil dan tingkat berikutnya akan diturunkan.')) skipCurrent('manual_skip');
        };
        document.body.appendChild(button);
        return button;
      };
      const clear = (removeDeadline = true) => {
        clearTimeout(revealTimer);
        clearTimeout(autoTimer);
        revealTimer = null;
        autoTimer = null;
        activeKey = '';
        const button = document.getElementById('juniorStage2TimedSkip');
        if (button) button.style.display = 'none';
        if (removeDeadline) localStorage.removeItem(storageKey);
      };
      const skipCurrent = outcomeReason => {
        if (state.finished) return;
        const question = state.currentQuestion;
        const meta = {
          1: ['Klasifikasi Data Hewan', 'Memasangkan hewan, jumlah kaki, dan ciri ke block data yang tepat.'],
          2: ['Algoritma Rute', 'Menyusun program agar kucing mencapai ikan melalui jalur aman.'],
          3: ['Debugging Program', 'Menemukan dan mengganti dua block yang membuat bebek tidak sampai ke kolam.']
        }[question];
        const submittedAt = new Date().toISOString();
        state.trail.push({
          question,
          questionId: `junior-stage2-${String(question).padStart(2, '0')}`,
          focus: meta[0],
          prompt: meta[1],
          difficulty: question,
          submissionAttemptCount: Math.max(1, Number(state.questionState.attempts || 0)),
          firstSubmissionCorrect: false,
          finalSubmissionCorrect: false,
          resetCount: Number(state.questionState.resetCount || 0),
          durationSeconds: Math.round((Date.now() - state.questionState.startedAt) / 1000),
          submittedAt,
          outcomeReason
        });
        clear();
        persistProgress();
        routeAfterQuestion(false);
      };
      const arm = () => {
        const key = `stage2:${state.currentQuestion}`;
        if (activeKey === key) return;
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(storageKey) || 'null'); } catch (error) {}
        clear(false);
        activeKey = key;
        const now = Date.now();
        const deadline = saved?.key === key && Number(saved.autoAt) > now
          ? saved
          : { key, skipAt: now + timerDelay(60000, 'qcSkipMs'), autoAt: now + timerDelay(120000, 'qcAutoMs') };
        localStorage.setItem(storageKey, JSON.stringify(deadline));
        const button = ensureButton();
        const reveal = () => { if (activeKey === key) button.style.display = 'block'; };
        const skipRemaining = Math.max(0, Number(deadline.skipAt) - now);
        if (skipRemaining === 0) reveal();
        else revealTimer = setTimeout(reveal, skipRemaining);
        autoTimer = setTimeout(() => { if (activeKey === key) skipCurrent('timeout'); }, Math.max(0, Number(deadline.autoAt) - now));
      };
      const originalRender = render;
      const patchedRender = function() {
        const output = originalRender.apply(this, arguments);
        if (!state.finished) arm();
        else clear();
        return output;
      };
      render = patchedRender;
      window.render = patchedRender;
      const originalRouteAfterQuestion = routeAfterQuestion;
      const patchedRouteAfterQuestion = function() {
        clear();
        return originalRouteAfterQuestion.apply(this, arguments);
      };
      routeAfterQuestion = patchedRouteAfterQuestion;
      window.routeAfterQuestion = patchedRouteAfterQuestion;
      arm();
      window.__juniorStage2V1Patched = true;
    }

    function installJuniorRuntimePatches() {
      const stageWindow = frame.contentWindow;
      if (!stageWindow) return;
      if (activeStage === 1) {
        stageWindow.eval(`(${juniorStage1RuntimePatch.toString()})()`);
      } else if (activeStage === 2) {
        stageWindow.eval(`(${juniorStage2RuntimePatch.toString()})()`);
      }
    }

    function connectFlow() {
      try {
        installJuniorRuntimePatches();
        if (activeStage === 1) continueAfterStage1();
        if (activeStage === 2 && !stage2Wired) wireStage2();
        if (activeStage === 3) wireStage3();
      } catch (error) { }
    }

    document.getElementById("close-note").addEventListener("click", () => {
      note.classList.remove("visible");
      localStorage.removeItem(STAGE_1_STORAGE);
      localStorage.removeItem(STAGE_2_STORAGE);
      localStorage.removeItem("pt_stage2_junior_progress");
      localStorage.removeItem("kalananti-stage3-junior-progress-v1");
      localStorage.removeItem("kalananti-stage3-junior-interest-v1");
      localStorage.removeItem("pt_junior_final_result");
      location.href = location.href.split('#')[0].split('?')[0];
    });

    const params = new URLSearchParams(location.search);
    const directRegistration = readStorage("pt_student_registration") || readStorage("pt_student_profile");
    const juniorQcMode = params.get("qcStage3") === "1" || params.get("qcResult") === "1" || params.get("dev") === "1";
    if (!directRegistration && !juniorQcMode) {
      location.replace("index.html");
    }
    renderStudentIdentity();
    if (params.get("qcStage3") === "1") {
      openStage(3, true);
    } else {
      const savedStage = Number(localStorage.getItem("pt_active_stage_junior"));
      openStage([1, 2, 3].includes(savedStage) ? savedStage : 1, savedStage === 3);
    }

    frame.addEventListener("load", connectFlow);
    window.addEventListener("message", event => {
      if (event.source !== frame.contentWindow) return;
      if (event.data?.type === "kalananti-junior-stage1-progress") {
        const stage1 = readStorage(STAGE_1_STORAGE);
        if (stage1) window.PlacementSync?.saveStage(1, stage1);
      }
      if (event.data?.type === "kalananti-junior-stage1-complete") {
        const stage1 = readStorage(STAGE_1_STORAGE);
        if (stage1) window.PlacementSync?.saveStage(1, stage1);
        continueAfterStage1();
      }
      if (event.data?.type === "kalananti-junior-stage2-complete") {
        const stage2 = readStorage(STAGE_2_STORAGE);
        if (stage2) window.PlacementSync?.saveStage(2, stage2);
        wireStage2();
      }
      if (event.data?.type === "kalananti-junior-stage3-complete") {
        wireStage3();
      }
    });
    setInterval(connectFlow, 500);
  </script>
</body>
